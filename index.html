<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Misan Business Web Concept</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Poppins:wght@400;500;600;700&display=swap">
<style>
/* Layout: a business dashboard. Fixed dark sidebar on desktop, a scrolling tab strip on phones. Single committed light look. */
:root {
  --ink: #1C0045;
  --lime: #D9FF1F;
  --violet: #7A00E6;
  --violet-deep: #5A00AA;
  --lilac: #F0E6FF;
  --paper: #FFFFFF;
  --ground: #F6F5F9;
  --mist: #F1F0F5;
  --line: #E8E6EF;
  --text: #1C1C1E;
  --muted: #5F5F6B;
  --ok: #2E7D1F;
  --ok-bg: #E7F4E2;
  --warn: #8A4B0B;
  --warn-bg: #FFF3DD;
  --bad: #B3261E;
  --bad-bg: #FDECEA;
  --display: 'Archivo Black', 'Arial Black', 'Helvetica Neue', sans-serif;
  --body: 'Poppins', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono: ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
  color-scheme: light;
}
html, body { height: 100%; }
body { background: var(--ground); color: var(--text); font-family: var(--body); font-size: 14px; }
button, input, select { font-family: inherit; font-size: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--violet); outline-offset: 2px; }
.banner { background: var(--ink); color: var(--lime); font-size: 12px; font-weight: 600; text-align: center; padding-block: 7px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.app { display: grid; grid-template-columns: 236px minmax(0, 1fr); min-height: calc(100% - 32px); }
.side { background: var(--ink); color: #EDE6FA; padding: 20px 14px; display: flex; flex-direction: column; gap: 4px; position: sticky; top: 0; height: calc(100vh - 32px); box-sizing: border-box; overflow-y: auto; }
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 18px; }
.brand .mark { width: 34px; height: 34px; border-radius: 10px; background: var(--lime); color: var(--ink); display: grid; place-items: center; font-weight: 700; font-size: 13px; }
.brand b { display: block; font-size: 14px; }
.brand span { font-size: 11px; color: #B9A8DA; }
.navgroup { font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: #9C8CC0; padding: 14px 10px 6px; }
.nav { border: none; background: none; color: #DCD3EE; text-align: left; padding: 9px 10px; border-radius: 10px; font-weight: 500; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.nav:hover { background: rgba(255,255,255,.06); }
.nav[aria-current="page"] { background: var(--lime); color: var(--ink); font-weight: 700; }
.nav .count { font-size: 11px; font-weight: 700; background: var(--violet); color: #fff; border-radius: 999px; padding: 1px 7px; }
.nav[aria-current="page"] .count { background: var(--ink); color: var(--lime); }
.main { min-width: 0; display: flex; flex-direction: column; }
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-block: 14px; padding-left: max(28px, env(safe-area-inset-left, 0px)); padding-right: max(28px, env(safe-area-inset-right, 0px)); background: var(--paper); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.who { display: flex; align-items: center; gap: 12px; }
.bell { position: relative; width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--line); background: var(--paper); display: grid; place-items: center; }
.bell i { position: absolute; top: 8px; right: 9px; width: 8px; height: 8px; border-radius: 999px; background: var(--violet); }
.avatar { width: 36px; height: 36px; border-radius: 999px; background: var(--lilac); color: var(--violet-deep); display: grid; place-items: center; font-weight: 700; font-size: 13px; flex-shrink: 0; }
.content { padding-block: 26px 48px; padding-left: max(28px, env(safe-area-inset-left, 0px)); padding-right: max(28px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 20px; max-width: 1180px; width: 100%; box-sizing: border-box; }
.head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
h1 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 34px; line-height: 1.02; color: var(--ink); text-wrap: balance; }
.lede { margin: 6px 0 0; color: var(--muted); max-width: 62ch; line-height: 1.5; }
h2 { margin: 0; font-size: 16px; font-weight: 700; }
.small { font-size: 12px; color: var(--muted); }
.num { font-variant-numeric: tabular-nums; }
.grid { display: grid; gap: 16px; }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g21 { grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); }
.panel { background: var(--paper); border: 1px solid var(--line); border-radius: 18px; padding: 18px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.panel .ph { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.tile { background: var(--paper); border: 1px solid var(--line); border-radius: 18px; padding: 16px 18px; display: flex; flex-direction: column; gap: 6px; }
.tile .lab { font-size: 12px; color: var(--muted); font-weight: 500; }
.tile .val { font-family: var(--display); font-size: 24px; color: var(--ink); }
.tile.hero { background: var(--violet); border-color: var(--violet); color: #fff; }
.tile.hero .lab, .tile.hero .small { color: #EBDDFF; }
.tile.hero .val { color: #fff; }
.tile.dark { background: var(--ink); border-color: var(--ink); color: #fff; }
.tile.dark .lab, .tile.dark .small { color: #C9BCE6; }
.tile.dark .val { color: var(--lime); }
.pill { display: inline-block; font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 999px; white-space: nowrap; }
.ok { background: var(--ok-bg); color: var(--ok); }
.warn { background: var(--warn-bg); color: var(--warn); }
.bad { background: var(--bad-bg); color: var(--bad); }
.info { background: var(--lilac); color: var(--violet-deep); }
.grey { background: #ECECF1; color: #3D3D47; }
.new { background: var(--lime); color: var(--ink); }
.btn { min-height: 42px; padding: 0 18px; border-radius: 12px; border: none; background: var(--ink); color: var(--lime); font-weight: 600; white-space: nowrap; }
.btn.ghost { background: var(--paper); color: var(--ink); border: 1.5px solid var(--ink); }
.btn.soft { background: var(--lilac); color: var(--violet-deep); }
.btn.sm { min-height: 34px; padding: 0 12px; font-size: 13px; border-radius: 10px; }
.btns { display: flex; gap: 10px; flex-wrap: wrap; }
.tablewrap { overflow-x: auto; margin: 0 -18px; padding: 0 18px; }
table { width: 100%; border-collapse: collapse; min-width: 560px; }
th { text-align: left; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 600; padding: 0 12px 10px 0; border-bottom: 1px solid var(--line); }
td { padding: 12px 12px 12px 0; border-bottom: 1px solid var(--line); vertical-align: middle; }
tr:last-child td { border-bottom: none; }
td.r, th.r { text-align: right; }
td .sub { display: block; font-size: 12px; color: var(--muted); }
tr.click { cursor: pointer; }
tr.click:hover td { background: #FAF8FE; }
.code { width: 36px; height: 36px; border-radius: 999px; background: var(--lilac); color: var(--violet-deep); display: inline-grid; place-items: center; font-size: 11px; font-weight: 700; flex-shrink: 0; }
.cell { display: flex; align-items: center; gap: 10px; }
.tog { flex-shrink: 0; width: 46px; height: 28px; border: none; border-radius: 999px; padding: 3px; background: #C4C4CC; display: flex; justify-content: flex-start; transition: background .15s; }
.tog::after { content: ""; width: 22px; height: 22px; border-radius: 999px; background: #fff; }
.tog[aria-pressed="true"] { background: var(--violet); justify-content: flex-end; }
.setrow { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.setrow:last-child { border-bottom: none; }
.setrow .t { font-weight: 600; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-size: 12px; font-weight: 600; color: var(--muted); }
.field input, .field select { height: 42px; border: 1.5px solid var(--line); border-radius: 10px; padding: 0 12px; background: var(--paper); }
.field input:focus, .field select:focus { border-color: var(--violet); outline: none; }
input[type="range"] { accent-color: var(--violet); width: 100%; }
.opts { display: grid; gap: 10px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
.opt { border: 2px solid var(--line); border-radius: 14px; background: var(--paper); padding: 14px; text-align: left; display: flex; flex-direction: column; gap: 4px; }
.opt[aria-pressed="true"] { border-color: var(--violet); background: #FBF8FF; }
.opt .t { font-weight: 700; }
.recips .opt { flex-direction: row; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 14px; }
.panel .btn.primary, .panel .btn.secondary { align-self: flex-start; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { border: 1.5px solid var(--line); background: var(--paper); border-radius: 999px; padding: 6px 14px; font-weight: 600; font-size: 13px; }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--lime); }
.kv { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.kv:last-child { border-bottom: none; }
.kv .k { color: var(--muted); }
.kv .v { font-weight: 700; text-align: right; }
.steps { display: flex; flex-direction: column; }
.step { display: flex; gap: 12px; }
.rail { display: flex; flex-direction: column; align-items: center; width: 14px; flex-shrink: 0; }
.dot { width: 12px; height: 12px; border-radius: 999px; box-sizing: border-box; border: 3px solid; margin-top: 4px; }
.line { flex: 1; width: 2px; min-height: 18px; background: var(--line); }
.step:last-child .line { visibility: hidden; }
.step .body { padding-bottom: 12px; display: flex; flex-direction: column; gap: 1px; }
.d-done { border-color: var(--ok); background: var(--ok); }
.d-now { border-color: var(--violet); background: #fff; }
.d-hold { border-color: #C77B1C; background: #fff; }
.d-todo { border-color: #C4C4CC; background: #fff; }
.note { background: var(--warn-bg); color: var(--warn); border-radius: 14px; padding: 14px 16px; line-height: 1.5; }
.note.violet { background: var(--lilac); color: var(--violet-deep); }
.term { background: var(--ink); color: #EDE6FA; border-radius: 14px; padding: 16px; font-family: var(--mono); font-size: 12.5px; line-height: 1.7; overflow-x: auto; }
.term .m { color: var(--lime); }
.chart svg { width: 100%; height: auto; display: block; }
.bar-track { height: 8px; border-radius: 999px; background: var(--mist); overflow: hidden; }
.bar-track span { display: block; height: 100%; background: var(--violet); }
.toast { position: fixed; right: max(24px, env(safe-area-inset-right, 0px)); bottom: calc(24px + env(safe-area-inset-bottom, 0px)); max-width: min(380px, calc(100% - 48px)); background: var(--ink); color: #fff; border-radius: 14px; padding: 14px 16px; line-height: 1.45; box-shadow: 0 14px 34px -12px rgba(28,0,69,.55); z-index: 20; }
@media (max-width: 1100px) { .g4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .g21 { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 860px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .side { position: static; height: auto; flex-direction: row; overflow-x: auto; padding: 10px max(12px, env(safe-area-inset-right, 0px)) 10px max(12px, env(safe-area-inset-left, 0px)); gap: 6px; }
  .brand, .navgroup { display: none; }
  .nav { white-space: nowrap; flex-shrink: 0; }
  .g3, .g2, .opts { grid-template-columns: minmax(0, 1fr); }
  .content, .topbar { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  h1 { font-size: 28px; }
}
@media (max-width: 520px) { .g4 { grid-template-columns: minmax(0, 1fr); } .who .name { display: none; } }
@media (prefers-reduced-motion: reduce) { .tog { transition: none; } }

/* Onboarding: welcome, log in, sign up (new or switch from personal), verification. */
.ob { flex: 1; overflow-y: auto; background: var(--paper); color: var(--text); }
.ob.web { min-height: calc(100vh - 32px); background: var(--ground); }
.ob-wrap { max-width: 600px; margin: 0 auto; padding-block: 22px 44px; padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 14px; box-sizing: border-box; }
.ob.web .ob-wrap { padding-block: 40px 64px; }
.ob.web .ob-card { background: var(--paper); border: 1px solid var(--line); border-radius: 22px; padding: 28px; display: flex; flex-direction: column; gap: 14px; }
.ob:not(.web) .ob-card { display: flex; flex-direction: column; gap: 14px; }
.ob h1 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 30px; line-height: 1.04; color: var(--ink); text-wrap: balance; }
.ob h2 { margin: 6px 0 0; font-size: 15px; font-weight: 700; }
.ob-lede { margin: 0; color: var(--muted); line-height: 1.55; font-size: 14px; }
.ob-small { font-size: 12px; color: var(--muted); line-height: 1.5; margin: 0; }
.ob-hero { background: var(--ink); color: #fff; border-radius: 22px; padding: 26px 22px; display: flex; flex-direction: column; gap: 10px; }
.ob-hero .word { font-family: var(--display); font-size: 34px; line-height: 1; color: var(--lime); }
.ob-hero p { margin: 0; color: #DCD3EE; line-height: 1.55; }
.ob-btn { min-height: 52px; border: none; border-radius: 14px; background: var(--ink); color: var(--lime); font-weight: 600; font-size: 15px; width: 100%; font-family: inherit; cursor: pointer; }
.ob-btn.ghost { background: transparent; color: var(--ink); border: 2px solid var(--ink); }
.ob-btn.soft { background: var(--lilac); color: var(--violet-deep); min-height: 40px; font-size: 13px; width: auto; padding: 0 14px; border-radius: 10px; }
.ob-btn[disabled] { opacity: .45; cursor: not-allowed; }
.ob-row { display: flex; gap: 10px; flex-wrap: wrap; }
.ob-row > * { flex: 1 1 160px; }
.ob-link { border: none; background: none; color: var(--violet); font-weight: 600; font-family: inherit; font-size: 14px; padding: 6px 0; cursor: pointer; align-self: flex-start; }
.ob-back { width: 44px; height: 44px; margin: -6px 0 -6px -10px; border: none; background: none; display: grid; place-items: center; cursor: pointer; }
.ob-field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.ob-field label { font-size: 12px; font-weight: 600; color: var(--muted); }
.ob-field input, .ob-field select { height: 48px; border: 1.5px solid #E0DEE8; border-radius: 12px; padding: 0 14px; background: #fff; font-family: inherit; font-size: 16px; color: var(--text); width: 100%; box-sizing: border-box; }
.ob-field input:focus, .ob-field select:focus { border-color: var(--violet); outline: none; }
.ob-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 520px) { .ob-grid { grid-template-columns: minmax(0, 1fr); } }
.ob-opts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
@media (max-width: 520px) { .ob-opts { grid-template-columns: minmax(0, 1fr); } }
.ob-opt { border: 2px solid #E2E2E8; border-radius: 14px; background: #fff; padding: 12px 14px; text-align: left; display: flex; flex-direction: column; gap: 2px; font-family: inherit; cursor: pointer; color: var(--text); }
.ob-opt[aria-pressed="true"] { border-color: var(--violet); background: #FBF8FF; }
.ob-opt b { font-size: 14px; }
.ob-opt span { font-size: 12px; color: var(--muted); }
.ob-steps { display: flex; gap: 6px; }
.ob-steps span { flex: 1; height: 5px; border-radius: 999px; background: #E4E2EC; }
.ob-steps span.on { background: var(--violet); }
.ob-stepname { font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: .04em; text-transform: uppercase; }
.ob-kv { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--line); }
.ob-kv:last-child { border-bottom: none; }
.ob-kv .k { color: var(--muted); font-size: 14px; }
.ob-kv .v { font-weight: 600; text-align: right; font-size: 14px; }
.ob-box { background: var(--mist); border-radius: 16px; padding: 4px 16px; }
.ob-found { border: 2px solid var(--violet); border-radius: 16px; padding: 14px 16px; background: #FBF8FF; display: flex; flex-direction: column; gap: 4px; }
.ob-found b { font-size: 15px; }
.ob-tick { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 999px; background: var(--ok-bg); color: var(--ok); font-size: 12px; font-weight: 700; flex-shrink: 0; }
.ob-wait { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 999px; background: var(--warn-bg); color: var(--warn); font-size: 12px; font-weight: 700; flex-shrink: 0; }
.ob-check { display: flex; align-items: flex-start; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.ob-check:last-child { border-bottom: none; }
.ob-check .t { font-weight: 600; font-size: 14px; }
.ob-check .grow { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.ob-pill { font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
.ob-pill.ok { background: var(--ok-bg); color: var(--ok); }
.ob-pill.warn { background: var(--warn-bg); color: var(--warn); }
.ob-pill.info { background: var(--lilac); color: var(--violet-deep); }
.ob-note { background: var(--lilac); color: var(--violet-deep); border-radius: 14px; padding: 12px 14px; font-size: 13px; line-height: 1.5; }
.ob-note.warn { background: var(--warn-bg); color: var(--warn); }
.ob-err { background: #FDECEA; color: #B3261E; border-radius: 12px; padding: 10px 14px; font-size: 13px; font-weight: 600; }
.ob-chips { display: flex; gap: 8px; flex-wrap: wrap; }
.ob-chip { border: 1.5px solid #E2E2E8; background: #fff; border-radius: 999px; padding: 7px 14px; font-weight: 600; font-size: 13px; font-family: inherit; cursor: pointer; color: var(--text); }
.ob-chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--lime); }
.ob-consent { display: flex; gap: 10px; align-items: flex-start; font-size: 13px; line-height: 1.5; }
.ob-consent input { width: 20px; height: 20px; margin-top: 1px; accent-color: var(--violet); flex-shrink: 0; }
.ob-otp { letter-spacing: .5em; font-variant-numeric: tabular-nums; text-align: center; font-weight: 700; }
.ob-selfie { border: 2px dashed #CFC8E0; border-radius: 16px; padding: 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
[hidden] { display: none !important; }

/* Tables: toolbar, pagination */
.tbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.tsearch { flex: 1 1 220px; min-width: 0; display: flex; align-items: center; gap: 8px; background: var(--mist); border-radius: 10px; padding: 0 12px; }
.tsearch input { border: none; background: none; height: 38px; width: 100%; outline: none; min-width: 0; }
.tfilter { height: 38px; border: 1.5px solid var(--line); border-radius: 10px; padding: 0 10px; background: var(--paper); flex: 0 1 auto; max-width: 100%; }
.tpage { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.btn[disabled] { opacity: .4; cursor: not-allowed; }
.kyb { display: flex; justify-content: space-between; align-items: center; gap: 14px; flex-wrap: wrap; border-radius: 16px; padding: 14px 18px; line-height: 1.5; }
.kyb.warn { background: var(--warn-bg); color: var(--warn); }
.kyb.info { background: var(--lilac); color: var(--violet-deep); }
.kyb > span:first-child { flex: 1 1 320px; min-width: 0; }
.mono { font-family: var(--mono); font-size: 12.5px; }
.keybox { background: var(--paper); border: 1.5px dashed var(--violet); border-radius: 10px; padding: 10px 12px; margin: 10px 0; word-break: break-all; color: var(--ink); }
.err { background: var(--bad-bg); color: var(--bad); border-radius: 10px; padding: 10px 12px; font-size: 13px; font-weight: 600; }
.row-opt { flex-direction: row !important; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 14px; }
.topbar { justify-content: flex-end; }

.emptybox{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:20px;background:#F6F3FB;border-radius:12px}
.emptybox b{font-size:15px;color:#1C0045}.emptybox span{color:#5F5F6B;line-height:1.5;max-width:52ch}.emptybox .btn{margin-top:6px}
.simbox{display:flex;flex-direction:column;gap:10px;padding:14px;border:1px dashed #CDB4F5;border-radius:12px;background:#FBF9FE}
.demologins{display:flex;flex-direction:column;gap:8px}
</style>
</head>
<body>

<div class="banner">Concept by Chiamaka Obioha · not an official Misan product · all figures are samples</div>
<div class="ob web" id="ob" hidden></div>
<div class="app">
  <nav class="side" id="side" aria-label="Main"></nav>
  <div class="main">
    <header class="topbar">
      <div class="who">
        <button class="bell" data-a="bell" aria-label="Notifications"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1C0045" stroke-width="2"><path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4zM10 20h4"/></svg><i></i></button>
        <button class="btn sm ghost" data-a="logout">Log out</button>
        <span class="avatar" id="whoAv">KO</span>
        <span class="name"><b id="whoName" style="display:block;font-size:13px">Kola Ogun</b><span class="small">Owner</span></span>
      </div>
    </header>
    <main class="content" id="view"></main>
  </div>
</div>
<div class="toast" id="toast" role="status" hidden></div>
<script>

/* Onboarding module. Renders into #ob.
   Host provides: window.obHostShow(showApp), window.obKyb(status), window.obMode(mode, acct).
   mode: 'fresh' (new business, empty) or 'demo' (established, sample data). */
(function () {
  const el = document.getElementById('ob');
  const DEMO = {
    fresh: { email: 'newbiz@demo.misan', pass: 'demo1234', acct: { first: 'Ada', last: 'Nwosu', email: 'newbiz@demo.misan', phone: '+234 802 000 4455', biz: 'Ada Foods Ltd' } },
    est: { email: 'kola@kolaexports.example', pass: 'demo1234', acct: { first: 'Kola', last: 'Ogun', email: 'kola@kolaexports.example', phone: '+234 803 000 1122', biz: 'Kola Exports Ltd' } }
  };
  const PERSONAL = { first: 'Tolu', last: 'Adebayo', phone: '+234 806 000 7788', email: 'tolu.adebayo@example.com' };
  const accounts = { est: { acct: DEMO.est.acct, kyb: 'verified', mode: 'demo', path: 'new' }, fresh: { acct: DEMO.fresh.acct, kyb: 'none', mode: 'fresh', path: 'new' } };
  const O = { view: 'welcome', who: null, step: 0, entity: 'ltd', looked: false, industry: 'Import and export', selfie: false,
    invited: {}, signers: { me: true }, pep: 'no', nominee: 'no', docs: {}, consent: false, consent2: false, err: '', note: '', f: {} };
  const cur = () => accounts[O.who] || { acct: { first: '', last: '', email: '', phone: '', biz: '' }, kyb: 'none', mode: 'fresh', path: 'new' };
  const A = () => cur().acct;
  const fv = (id, def) => (O.f[id] !== undefined ? O.f[id] : (def || '')).toString().replace(/"/g, '&quot;');
  const ent = {
    ltd: { label: 'Limited company', sub: 'Ltd, registered with CAC (RC number)', num: 'RC number' },
    bn: { label: 'Business name', sub: 'Sole owner or partnership (BN number)', num: 'BN number' },
    it: { label: 'Incorporated trustees', sub: 'NGO, church, association (IT number)', num: 'IT number' }
  };
  const dnfbp = ['Real estate', 'Car dealership', 'Hotels and hospitality', 'Jewellery and precious metals', 'NGO or charity'];
  const me = () => (A().first + ' ' + A().last).trim();
  const people = () => O.entity === 'bn'
    ? [['me', me(), 'Proprietor, 100%', true]]
    : O.entity === 'it'
      ? [['me', me(), 'Trustee and chair', true], ['p2', 'Emeka Obi', 'Trustee', false]]
      : [['me', me(), 'Director, 70% of shares', true], ['p2', 'Emeka Obi', 'Director, 30% of shares', false]];
  const docList = () => {
    const d = O.entity === 'ltd'
      ? [['cert', 'Certificate of incorporation', 'cac'], ['status', 'CAC status report (directors, shareholders, persons with significant control)', 'cac'], ['memart', 'Memorandum and articles of association', 'up'], ['board', 'Board resolution to open the account and name signatories', 'up'], ['addr', 'Proof of business address (utility bill from the last 3 months)', 'up']]
      : O.entity === 'bn'
        ? [['cert', 'Business name certificate', 'cac'], ['status', 'CAC status report showing the proprietor(s)', 'cac'], ['addr', 'Proof of business address (utility bill from the last 3 months)', 'up']]
        : [['cert', 'Certificate of incorporated trustees', 'cac'], ['const', 'Constitution', 'up'], ['board', 'Trustees\' resolution to open the account', 'up'], ['scuml', 'SCUML registration certificate', 'up'], ['addr', 'Proof of address (utility bill from the last 3 months)', 'up']];
    if (O.entity !== 'it' && dnfbp.includes(O.industry)) d.push(['scuml', 'SCUML registration certificate (required for your industry)', 'up']);
    return d;
  };
  const stepNames = ['You', 'Business', 'People', 'Documents', 'Review'];
  const back = (to) => `<button class="ob-back" data-ob="to" data-v="${to}" aria-label="Back"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1C0045" stroke-width="2.2" stroke-linecap="round"><path d="M20 12H4M10 6l-6 6 6 6"/></svg></button>`;
  const tick = '<span class="ob-tick" aria-hidden="true">✓</span>';
  const wait = '<span class="ob-wait" aria-hidden="true">…</span>';
  const err = () => O.err ? `<div class="ob-err" role="alert">${O.err}</div>` : '';
  const note = () => O.note ? `<div class="ob-note" role="status">${O.note}</div>` : '';
  const stepper = () => `<div class="ob-row" style="justify-content:space-between;align-items:center"><span class="ob-stepname" style="flex:0 1 auto">Business verification · step ${O.step + 1} of 5 · ${stepNames[O.step]}</span><button class="ob-link" data-ob="later" style="flex:0 0 auto">Finish later</button></div><div class="ob-steps" aria-hidden="true">${stepNames.map((_, i) => `<span class="${i <= O.step ? 'on' : ''}"></span>`).join('')}</div>`;
  const nav = (nextLabel) => `${err()}<div class="ob-row">${O.step > 0 ? '<button class="ob-btn ghost" data-ob="prev">Back</button>' : ''}<button class="ob-btn" data-ob="next">${nextLabel || 'Continue'}</button></div>`;
  const val = (id) => (O.f[id] || '').trim();
  const inp = (id, label, ph, extra) => `<div class="ob-field"><label for="${id}">${label}</label><input id="${id}" value="${fv(id)}" placeholder="${ph || ''}" ${extra || ''}></div>`;

  const V = {
    welcome: () => `
      <div class="ob-hero"><span class="word">MISAN BUSINESS</span><p>Collect, pay, earn and borrow across Nigeria, Ghana, Kenya, the UK, Europe and Canada, from one business account.</p></div>
      <button class="ob-btn" data-ob="to" data-v="signup">Create a business account</button>
      <button class="ob-btn ghost" data-ob="to" data-v="switchSignin">I already use Misan for personal</button>
      <p class="ob-small" style="text-align:center">Already have a business account? <button class="ob-link" data-ob="to" data-v="login" style="padding:0">Log in</button></p>
      <p class="ob-small" style="text-align:center">Concept prototype by Chiamaka Obioha. Not an official Misan product. No real data is collected.</p>`,
    signup: () => `${back('welcome')}<h1>CREATE YOUR ACCOUNT</h1>
      <p class="ob-lede">It takes about a minute. You'll verify the business after you're in.</p>
      <div class="ob-grid">${inp('su-first', 'First name', 'e.g. Ada', 'autocomplete="given-name"')}${inp('su-last', 'Last name', 'e.g. Nwosu', 'autocomplete="family-name"')}</div>
      ${inp('su-biz', 'Business name', 'As registered with CAC', 'autocomplete="organization"')}
      ${inp('su-email', 'Work email', 'name@yourbusiness.com', 'type="email" autocomplete="email"')}
      ${inp('su-phone', 'Phone number', '+234 800 000 0000', 'inputmode="tel" autocomplete="tel"')}
      ${inp('su-pass', 'Password', 'At least 8 characters', 'type="password" autocomplete="new-password"')}
      ${err()}<button class="ob-btn" data-ob="signup">Create account</button>
      <p class="ob-small">By continuing you agree to the terms and privacy notice. We'll text a code to confirm your phone.</p>`,
    otpSignup: () => `${back('signup')}<h1>CONFIRM YOUR PHONE</h1>
      <p class="ob-lede">Enter the 6-digit code we sent to ${A().phone}.</p>
      <div class="ob-note" role="note"><b>Demo code: 123456</b><br>This is a prototype, so no text is sent. Type 123456 or any other 6 digits.</div>
      ${inp('ob-otp', 'Code', 'e.g. 123456', 'class="ob-otp" inputmode="numeric" maxlength="6"')}
      ${err()}<button class="ob-btn" data-ob="signupDone">Confirm</button>`,
    login: () => `${back('welcome')}<h1>LOG IN</h1>
      ${inp('li-email', 'Work email', 'name@yourbusiness.com', 'autocomplete="username"')}
      ${inp('li-pass', 'Password', 'Your password', 'type="password" autocomplete="current-password"')}
      ${err()}${note()}<button class="ob-btn" data-ob="login">Log in</button>
      <button class="ob-link" data-ob="forgot">Forgot password?</button>
      <h2>Demo logins</h2>
      <div class="ob-box">
        <div class="ob-check"><span class="grow"><span class="t">New business, not yet verified</span><span class="ob-small">${DEMO.fresh.email} · ${DEMO.fresh.pass}<br>Empty account: no money, no transactions. Verify it, then make your own test transactions.</span></span><button class="ob-btn soft" data-ob="demo" data-v="fresh">Use</button></div>
        <div class="ob-check"><span class="grow"><span class="t">Established business, verified</span><span class="ob-small">${DEMO.est.email} · ${DEMO.est.pass}<br>Months of sample activity across every screen.</span></span><button class="ob-btn soft" data-ob="demo" data-v="est">Use</button></div>
        ${accounts.signup ? `<div class="ob-check"><span class="grow"><span class="t">The account you created</span><span class="ob-small">${accounts.signup.acct.email} · your password</span></span><button class="ob-btn soft" data-ob="demo" data-v="signup">Use</button></div>` : ''}
      </div>`,
    otp: () => `${back('login')}<h1>CHECK YOUR PHONE</h1>
      <p class="ob-lede">Enter the 6-digit code we sent to ${A().phone.slice(0, 8)} *** ${A().phone.slice(-4)}.</p>
      <div class="ob-note" role="note"><b>Demo code: 123456</b><br>This is a prototype, so no text is sent. Type 123456 or any other 6 digits.</div>
      ${inp('ob-otp', 'Code', 'e.g. 123456', 'class="ob-otp" inputmode="numeric" maxlength="6"')}
      ${err()}${note()}<button class="ob-btn" data-ob="verifyOtp">Verify and log in</button>
      <button class="ob-link" data-ob="resend">Send a new code</button>`,
    switchSignin: () => `${back('welcome')}<h1>USE YOUR PERSONAL ACCOUNT</h1>
      <p class="ob-lede">Sign in with your personal Misan details. Your identity checks carry over, so verifying the business later is quicker.</p>
      ${inp('sw-phone', 'Phone number on your personal account', PERSONAL.phone, 'inputmode="tel"')}
      ${inp('sw-pin', 'Transaction PIN', '4 digits', 'type="password" inputmode="numeric" maxlength="4"')}
      <p class="ob-small">Demo personal account: ${PERSONAL.phone} · PIN 1234</p>
      ${err()}<button class="ob-btn" data-ob="switchSignin">Continue</button>`,
    switchBiz: () => `${back('switchSignin')}<h1>HI ${PERSONAL.first.toUpperCase()}, ADD YOUR BUSINESS</h1>
      <p class="ob-lede">Your personal and business money stay in separate accounts. You can switch between them in the app.</p>
      ${inp('sw-biz', 'Business name', 'As registered with CAC')}
      ${inp('sw-email', 'Work email', 'name@yourbusiness.com', 'type="email"')}
      ${err()}<button class="ob-btn" data-ob="switchDone">Create business account</button>`,
    kybPrompt: () => `<h1>VERIFY ${A().biz.toUpperCase()}</h1>
      <p class="ob-lede">You're logged in. Before you can collect, pay out or use Earn, we need to verify the business. This is a Central Bank of Nigeria requirement for every business account.</p>
      <div class="ob-box">
        ${cur().path === 'switch' ? `<div class="ob-check">${tick}<span class="grow"><span class="t">Your identity</span><span class="ob-small">Already verified on your personal account</span></span></div>` : `<div class="ob-check">${wait}<span class="grow"><span class="t">Your identity</span><span class="ob-small">BVN, NIN, date of birth, address and a selfie</span></span></div>`}
        <div class="ob-check">${wait}<span class="grow"><span class="t">Business details</span><span class="ob-small">CAC number, industry, expected activity</span></span></div>
        <div class="ob-check">${wait}<span class="grow"><span class="t">Owners and directors</span><span class="ob-small">Anyone with more than 5% or control verifies their BVN and NIN</span></span></div>
        <div class="ob-check">${wait}<span class="grow"><span class="t">Documents</span><span class="ob-small">We fetch what we can from CAC</span></span></div>
      </div>
      <p class="ob-small">Takes about ${cur().path === 'switch' ? '7' : '10'} minutes. You can save and finish later.</p>
      <button class="ob-btn" data-ob="kybStart">Start verification</button>
      <button class="ob-btn ghost" data-ob="later">Do it later</button>`,
    flow: () => [stepYou, stepBusiness, stepPeople, stepDocs, stepReview][O.step](),
    submitted: () => {
      const ps = people().filter((p) => !p[3]);
      return `<h1>WE'RE VERIFYING ${A().biz.toUpperCase()}</h1>
      <p class="ob-lede">Most businesses are verified within 1 business day. We'll notify you at each step.</p>
      <div class="ob-box">
        <div class="ob-check">${tick}<span class="grow"><span class="t">Business matched on the CAC register</span><span class="ob-small">${ent[O.entity].num} ${val('kb-rc')} · Active</span></span></div>
        <div class="ob-check">${tick}<span class="grow"><span class="t">Your BVN and NIN</span><span class="ob-small">${cur().path === 'switch' ? 'Reused from your personal account' : 'Checked with NIBSS and NIMC'}</span></span></div>
        <div class="ob-check">${tick}<span class="grow"><span class="t">Sanctions and PEP screening</span><span class="ob-small">No matches</span></span></div>
        ${ps.map((p) => `<div class="ob-check">${wait}<span class="grow"><span class="t">${p[1]}: BVN, NIN and selfie</span><span class="ob-small">${O.invited[p[0]] ? 'Invite sent, waiting for them' : 'Not invited yet'}</span></span></div>`).join('')}
        <div class="ob-check">${wait}<span class="grow"><span class="t">Document review</span><span class="ob-small">Usually within 1 business day</span></span></div>
      </div>
      <div class="ob-note">While you wait, you can explore the dashboard, add payees and invite your team. Money movement unlocks once verification is complete. In this demo, use "Mark as verified" on the banner to skip the wait.</div>
      <button class="ob-btn" data-ob="done">Back to the dashboard</button>`;
    }
  };

  function stepYou() {
    if (cur().path === 'switch') return `${stepper()}<h1>YOUR DETAILS</h1>
      <p class="ob-lede">We already have these from your personal Misan account. You don't need to verify them again.</p>
      <div class="ob-box">
        <div class="ob-kv"><span class="k">Full name</span><span class="v">${me()} ${tick}</span></div>
        <div class="ob-kv"><span class="k">Date of birth</span><span class="v">04 Jun 1990 ${tick}</span></div>
        <div class="ob-kv"><span class="k">BVN</span><span class="v">221 *** 0938 ${tick}</span></div>
        <div class="ob-kv"><span class="k">NIN</span><span class="v">*** *** 7716 ${tick}</span></div>
        <div class="ob-kv"><span class="k">Phone</span><span class="v">${PERSONAL.phone.slice(0, 8)} *** ${PERSONAL.phone.slice(-4)} ${tick}</span></div>
        <div class="ob-kv"><span class="k">Home address</span><span class="v">Yaba, Lagos ${tick}</span></div>
        <div class="ob-kv"><span class="k">Selfie and liveness check</span><span class="v">Done Jul 2026 ${tick}</span></div>
      </div>
      <div class="ob-field"><label for="kb-role">Your role in the business</label><select id="kb-role"><option>Director</option><option>Proprietor</option><option>Trustee</option><option>Finance lead</option></select></div>
      <label class="ob-consent"><input type="checkbox" id="ob-c2" ${O.consent2 ? 'checked' : ''}><span>I agree that Misan can reuse my personal identity verification for this business account.</span></label>
      ${nav()}`;
    return `${stepper()}<h1>ABOUT YOU</h1>
      <p class="ob-lede">You're the account owner, ${me()}. We check these details with NIBSS and NIMC.</p>
      <div class="ob-grid">
        ${inp('kb-dob', 'Date of birth', 'DD/MM/YYYY', 'inputmode="numeric"')}
        <div class="ob-field"><label for="kb-role">Your role in the business</label><select id="kb-role"><option>Director</option><option>Proprietor</option><option>Trustee</option><option>Finance lead</option></select></div>
        ${inp('kb-bvn', 'BVN', '11 digits', 'inputmode="numeric" maxlength="11"')}
        ${inp('kb-nin', 'NIN', '11 digits', 'inputmode="numeric" maxlength="11"')}
      </div>
      ${inp('kb-addr', 'Home address', 'Street, area, city')}
      <div class="ob-selfie"><span><b>Selfie and liveness check</b><span class="ob-small" style="display:block">Matches your face to your BVN photo</span></span>${O.selfie ? '<span class="ob-pill ok">Done</span>' : '<button class="ob-btn soft" data-ob="selfie">Take selfie</button>'}</div>
      ${nav()}`;
  }
  function stepBusiness() {
    const e = ent[O.entity];
    const found = O.looked ? `<div class="ob-found"><b>${A().biz.toUpperCase()}</b>
      <span class="ob-small">${e.num} ${val('kb-rc')} · Status: Active</span>
      ${O.entity === 'ltd' ? '<span class="ob-small">Your RC number is also your Tax ID under the 2026 tax rules.</span>' : ''}</div>` : '';
    return `${stepper()}<h1>YOUR BUSINESS</h1>
      <div class="ob-opts">${Object.keys(ent).map((k) => `<button class="ob-opt" data-ob="entity" data-v="${k}" aria-pressed="${O.entity === k}"><b>${ent[k].label}</b><span>${ent[k].sub}</span></button>`).join('')}</div>
      <div class="ob-row" style="align-items:flex-end"><div class="ob-field" style="flex:2 1 200px"><label for="kb-rc">${e.num}</label><input id="kb-rc" value="${fv('kb-rc')}" placeholder="Any 5 to 8 digits for this demo" inputmode="numeric"></div><button class="ob-btn soft" data-ob="lookup" style="flex:0 0 auto;min-height:48px">Find on CAC</button></div>
      ${found}
      ${O.looked ? inp('kb-addrb', 'Business address', 'Street, area, city') : ''}
      ${O.entity !== 'ltd' ? inp('kb-tin', 'Tax ID (TIN)', 'e.g. 12345678-0001', 'inputmode="numeric"') : ''}
      <div class="ob-grid">
        <div class="ob-field"><label for="kb-ind">Industry</label><select id="kb-ind">${['Import and export', 'Retail and e-commerce', 'Food and agriculture', 'Logistics', 'Technology', 'Professional services', 'Real estate', 'Car dealership', 'Hotels and hospitality', 'Jewellery and precious metals', 'NGO or charity'].map((i) => `<option${i === O.industry ? ' selected' : ''}>${i}</option>`).join('')}</select></div>
        ${inp('kb-web', 'Website or social media page (optional)', 'e.g. yourbusiness.com or @yourbusiness')}
        <div class="ob-field"><label for="kb-vol">Expected money in and out each month</label><select id="kb-vol"><option>Up to ₦5 million</option><option>₦5m to ₦50m</option><option>₦50m to ₦500m</option><option>Over ₦500m</option></select></div>
        <div class="ob-field"><label for="kb-src">Where the money comes from</label><select id="kb-src"><option>Sales to customers</option><option>Investment or shareholder funds</option><option>Grants or donations</option><option>Loans</option></select></div>
      </div>
      <div class="ob-field"><label>Countries you'll send to or receive from</label><div class="ob-chips">${['Nigeria', 'Ghana', 'Kenya', 'United Kingdom', 'United States', 'Eurozone', 'Canada', 'China'].map((c) => `<button class="ob-chip" data-ob="chip" aria-pressed="false">${c}</button>`).join('')}</div></div>
      ${dnfbp.includes(O.industry) ? '<div class="ob-note warn">Businesses in this industry must also register with SCUML (the special control unit against money laundering). We\'ll ask for the certificate.</div>' : ''}
      ${nav()}`;
  }
  function stepPeople() {
    const ps = people();
    return `${stepper()}<h1>OWNERS AND DIRECTORS</h1>
      <p class="ob-lede">From your CAC record. Everyone who owns more than 5% of the business, or controls it, must verify their BVN, NIN and a selfie. We'll send each of them a secure link.</p>
      <div class="ob-box">${ps.map((p) => `<div class="ob-check">${p[3] ? tick : wait}<span class="grow"><span class="t">${p[1]}${p[3] ? ' (you)' : ''}</span><span class="ob-small">${p[2]}</span></span>${p[3] ? '<span class="ob-pill ok">Verified</span>' : O.invited[p[0]] ? '<span class="ob-pill info">Invite sent</span>' : `<button class="ob-btn soft" data-ob="invite" data-v="${p[0]}">Send invite</button>`}</div>`).join('')}</div>
      <h2>Who can approve payments?</h2>
      <div class="ob-chips">${ps.map((p) => `<button class="ob-chip" data-ob="signer" data-v="${p[0]}" aria-pressed="${!!O.signers[p[0]]}">${p[1]}</button>`).join('')}</div>
      <h2>Is any owner, director or signatory a politically exposed person?</h2>
      <p class="ob-small">For example a current or former senior public official, or their close family or associates.</p>
      <div class="ob-chips"><button class="ob-chip" data-ob="pep" data-v="no" aria-pressed="${O.pep === 'no'}">No</button><button class="ob-chip" data-ob="pep" data-v="yes" aria-pressed="${O.pep === 'yes'}">Yes</button></div>
      ${O.pep === 'yes' ? inp('kb-wealth', 'Their source of wealth', 'e.g. salary, business income, inheritance') + '<div class="ob-note warn">We\'ll apply enhanced checks and a senior compliance review. This can add 1 to 2 business days.</div>' : ''}
      ${O.entity !== 'bn' ? `<h2>Does anyone hold shares or a directorship on someone else's behalf?</h2>
      <div class="ob-chips"><button class="ob-chip" data-ob="nominee" data-v="no" aria-pressed="${O.nominee === 'no'}">No</button><button class="ob-chip" data-ob="nominee" data-v="yes" aria-pressed="${O.nominee === 'yes'}">Yes</button></div>
      ${O.nominee === 'yes' ? inp('kb-nomfor', 'Who are they acting for?', 'Full name of the person they act for') : ''}` : ''}
      ${nav()}`;
  }
  function stepDocs() {
    return `${stepper()}<h1>DOCUMENTS</h1>
      <p class="ob-lede">We fetch what we can from CAC. Upload the rest as PDF or photo.</p>
      <div class="ob-box">${docList().map((d) => {
        const have = d[2] === 'cac' || O.docs[d[0]];
        return `<div class="ob-check">${have ? tick : wait}<span class="grow"><span class="t">${d[1]}</span><span class="ob-small">${d[2] === 'cac' ? 'Fetched from CAC' : O.docs[d[0]] ? O.docs[d[0]] : 'Needed'}</span></span>${have ? '' : `<button class="ob-btn soft" data-ob="upload" data-v="${d[0]}">Upload</button>`}</div>`;
      }).join('')}</div>
      ${O.entity !== 'bn' ? '<button class="ob-link" data-ob="template">Download a board resolution template</button>' : ''}
      ${nav()}`;
  }
  function stepReview() {
    const ps = people();
    return `${stepper()}<h1>CHECK AND SUBMIT</h1>
      <div class="ob-box">
        <div class="ob-kv"><span class="k">Business</span><span class="v">${A().biz}</span></div>
        <div class="ob-kv"><span class="k">Type</span><span class="v">${ent[O.entity].label}, ${ent[O.entity].num} ${val('kb-rc')}</span></div>
        <div class="ob-kv"><span class="k">Industry</span><span class="v">${O.industry}</span></div>
        <div class="ob-kv"><span class="k">Account owner</span><span class="v">${me()}${cur().path === 'switch' ? ' (personal verification reused)' : ''}</span></div>
        <div class="ob-kv"><span class="k">Owners and directors</span><span class="v">${ps.length}, ${ps.filter((p) => p[3]).length} verified</span></div>
        <div class="ob-kv"><span class="k">Can approve payments</span><span class="v">${ps.filter((p) => O.signers[p[0]]).map((p) => p[1]).join(', ') || 'Nobody yet'}</span></div>

    const y = (v) => T + (H - T - B) * (1 - v / max);
    let g = '';
    for (let v = 0; v <= max + 1e-9; v += step) g += `<line x1="${L}" x2="${W - 4}" y1="${y(v)}" y2="${y(v)}" stroke="#E8E6EF"/><text x="${L - 8}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="#5F5F6B">${+v.toFixed(2)}</text>`;
    ms.forEach((m, i) => {
      const x = L + i * bw + bw * 0.2, w = bw * 0.6, last = i === ms.length - 1;

      const keyPanel = S.regen

          : `<div class="kv"><span class="k">Test key</span><span class="v mono">${masked}</span></div><div class="btns"><button class="btn sm ghost" data-a="regen">Regenerate key</button></div>`;
      const ipList = D.ips.map((ip, i) => `<div class="kv"><span><span class="mono" style="font-weight:600">${esc(ip[0])}</span><span class="small" style="display:block">${esc(ip[1])}</span></span><button class="btn sm ghost" data-a="ipRemove" data-v="${i}" aria-label="Remove ${esc(ip[0])}">Remove</button></div>`).join('') || '<p class="small" style="margin:0">No addresses yet. Calls are accepted from anywhere until you add one.</p>';
      const reqs = D.requests.map((r) => ({ f: r[3][0] === '2' ? 'Success (2xx)' : 'Error (4xx)', text: r.join(' '), cells: [`<span class="small num">${r[0]}</span>`, `<span class="mono"><b>${r[1]}</b> ${r[2]}</span>`, r[3][0] === '2' ? pill('ok', r[3]) : pill('bad', r[3] + (r[3] === '403' ? ' IP not allowed' : r[3] === '401' ? ' bad key' : ' invalid')), `<span class="mono">${r[4]}</span>`, `<span class="num">${r[5]}</span>`] }));

      return head('Developers', 'Collect, pay, earn and track from your own systems.', '') + `

            <div class="term"><span class="m">POST</span> /v1/collection-accounts<br><span class="m">POST</span> /v1/customers/{id}/accounts<br><span class="m">POST</span> /v1/payouts/bulk<br><span class="m">GET </span> /v1/collections/{id}<br><span class="m">POST</span> /v1/earn/withdrawals<br><span class="m">GET </span> /v1/settlements?date=</div>
          </section>
          <section class="panel"><div class="ph"><h2>IP allowlist</h2>${tog('ipAllow', 'Enforce IP allowlist', S.ipAllow)}</div>
            <p class="small" style="margin:0">${S.ipAllow ? 'Only these addresses can call the API with your keys.' : 'Not enforced: calls are accepted from any address.'}</p>
            ${ipList}
            <div class="grid g2"><div class="field"><label for="ipnew">IP address or range</label><input id="ipnew" placeholder="e.g. 102.89.34.18 or 41.58.120.0/24" class="mono"></div><div class="field"><label for="iplabel">Label</label><input id="iplabel" placeholder="e.g. Backup server"></div></div>
            ${S.ipErr ? `<div class="err">${S.ipErr}</div>` : ''}
            <div class="btns"><button class="btn sm" data-a="ipAdd">Add address</button></div>
          </section>

        <section class="panel"><div class="ph"><h2>Webhook</h2>${D.hookSaved ? pill('ok', 'Configured') : pill('warn', 'Not configured')}</div>
          <div class="field"><label for="hook">Endpoint URL</label><input id="hook" value="${esc(D.hookUrl)}" placeholder="https://api.yourbusiness.com/hooks/misan"></div>
          <div class="field"><label>Events to send</label><div class="chips">${events.map((e) => `<button class="chip mono" data-a="hookEvent" data-v="${e}" aria-pressed="${!!D.hookEvents[e]}">${e}</button>`).join('')}</div></div>
          <div class="kv"><span class="k">Signing secret</span><span class="v"><span class="mono">${D.hookSecret}••••••••</span> <button class="btn sm ghost" data-a="hookSecret">Regenerate</button></span></div>
          ${S.hookErr ? `<div class="err">${S.hookErr}</div>` : ''}
          <div class="btns" style="align-items:flex-end"><button class="btn" data-a="hookSave">Save webhook</button>
            <span class="field" style="min-width:200px"><label for="testev">Test event</label><select id="testev"${D.hookSaved ? '' : ' disabled'}>${events.filter((e) => D.hookEvents[e]).map((e) => `<option${e === S.testEvent ? ' selected' : ''}>${e}</option>`).join('')}</select></span>
            <button class="btn ghost" data-a="hookTest"${D.hookSaved ? '' : ' disabled title="Save the webhook first"'}>Send test event</button></div>
          ${D.hookSaved ? '' : '<p class="small" style="margin:0">Save an endpoint and at least one event before sending a test.</p>'}
        </section>
        <section class="panel"><div class="ph"><h2>Webhook deliveries</h2></div>${dtable('deliveries', { name: 'deliveries', filterLabel: 'event', filterPlural: 'events', file: 'webhook-deliveries', emptyText: 'No deliveries yet. Save your webhook and send a test event.', cols: [{ h: 'When', nowrap: true }, { h: 'Event' }, { h: 'Response' }, { h: 'Attempts', r: true }], rows: deliveries })}</section>
        <section class="panel"><div class="ph"><h2>API requests</h2></div>${dtable('requests', { name: 'requests', filterLabel: 'result', filterPlural: 'results', file: 'api-requests', emptyText: 'No API requests yet. Calls made with your keys show here.', cols: [{ h: 'When', nowrap: true }, { h: 'Request' }, { h: 'Status' }, { h: 'From IP' }, { h: 'Time', r: true }], rows: reqs })}</section>`;
    }
  };

  /* ---------- Shell ---------- */
  const viewEl = document.getElementById('view'), sideEl = document.getElementById('side'), toastEl = document.getElementById('toast');
  let tt;
  function toast(m) { toastEl.textContent = m; toastEl.hidden = false; clearTimeout(tt); tt = setTimeout(() => { toastEl.hidden = true; }, 3400); }
  function renderSide() {
    sideEl.innerHTML = `<div class="brand"><span class="mark">${initials(biz())}</span><span><b>${esc(biz())}</b><span>${D.mode === 'demo' ? 'Business account · sample data' : 'Business account · new'}</span></span></div>` +
      nav.map((g) => `<div class="navgroup">${g[0]}</div>` + g[1].map((n) => { const c = n[2] ? n[2]() : 0; return `<button class="nav" data-a="go" data-v="${n[0]}"${S.page === n[0] ? ' aria-current="page"' : ''}>${n[1]}${c ? `<span class="count">${c}</span>` : ''}</button>`; }).join('')).join('');
    const wn = document.getElementById('whoName'), wa = document.getElementById('whoAv');
    if (wn) wn.textContent = owner(); if (wa) wa.textContent = initials(owner());
  }
  function render(top) {
    viewEl.innerHTML = kybBanner() + pages[S.page]();
    renderSide();
    if (top) window.scrollTo(0, 0);
    try { if (location.hash.slice(1) !== S.page) history.replaceState(null, '', '#' + S.page); } catch (e) {}
  }
  function go(p) { if (pages[p]) { S.page = p; S.formErr = ''; render(true); } }
  const val = (id) => { const e = document.getElementById(id); return e ? e.value.trim() : ''; };
  function bad(m) { S.formErr = m; render(); }

  const A = {
    go, toast, noop: () => toast('Setting changed (demo).'),
    logout: () => { addAudit('Login', 'Signed out'); window.OB.start('welcome'); },
    kyb: () => window.OB.kyb(),
    kybVerify: () => { S.kyb = 'verified'; window.OB.setKyb('verified'); addAudit('Verification', 'Business verified by Misan compliance', 'All checks passed', 'System'); render(); toast(biz() + ' is verified. Money movement is unlocked.'); },
    exportT: (v) => { const p = v.split('|'); toast('Exported ' + p[0] + ' row' + (p[0] === '1' ? '' : 's') + ' to ' + p[1] + '-28-oct-2026.csv (demo).'); },
    pageT: (v) => { const p = v.split('|'); TB[p[0]].page += Number(p[1]); render(); },
    bell: () => toast(D.mode === 'demo' ? '3 new: payout run to approve, payment on hold, proof of address expiring.' : 'No new notifications.'),
    fundCur: (v) => { S.fundCur = v; S.formErr = ''; render(); },
    fundFor: (v) => { S.fundCur = v; go('fund'); },
    fundMethod: (v) => { S.fundMethod = v; S.formErr = ''; render(); },
    fundDone: (v) => {
      if (gated()) return;
      const c = S.fundCur, amt = num(val('famt'));
      if (!(amt > 0)) return bad('Enter an amount to add.');
      if (v === 'convert') {
        const from = val('ffrom'), cost = amt * rate[c] / rate[from];
        if (cost > D.bal[from]) return bad('Not enough in your ' + from + ' wallet. You need ' + money(from, cost) + '.');
        D.bal[from] -= cost; D.bal[c] += amt * (1 - FEE);
        D.topups.unshift([now(), 'Converted from ' + from + ' wallet (fee 2%)', 'Convert', signed(c, amt * (1 - FEE)), 'Credited']);
        addTx('Conversion from ' + from, 'Funding · ' + c, signed(c, amt * (1 - FEE)), 'Funding', ['ok', 'Credited']); addAudit('Money', 'Converted ' + money(from, cost) + ' to ' + money(c, amt * (1 - FEE)));
      } else {
        D.bal[c] += amt * (1 - FEE);
        const how = v === 'card' ? 'Business debit card (fee 2%)' : 'Bank transfer from ' + biz() + ' (fee 2%)';
        D.topups.unshift([now(), how, v === 'card' ? 'Card' : 'Bank transfer', signed(c, amt * (1 - FEE)), 'Credited']);
        addTx(v === 'card' ? 'Card top-up' : 'Bank transfer', 'Funding · ' + c, signed(c, amt * (1 - FEE)), 'Funding', ['ok', 'Credited']); addAudit('Money', 'Funded the ' + c + ' wallet with ' + money(c, amt) + ' by ' + (v === 'card' ? 'card' : 'bank transfer'));
      }
      S.formErr = ''; render(); toast(money(c, amt * (1 - FEE)) + ' added to your ' + c + ' wallet after the 2% fee.');
    },
    account: (v) => { S.account = v; S.formErr = ''; render(); },
    openAcc: () => { if (gated()) return; D.opened[S.account] = true; addAudit('Money', 'Opened a ' + S.account + ' collection account'); render(); toast('Your ' + S.account + ' account is ready, in the name ' + biz() + '.'); },
    simCollect: () => {
      if (gated()) return;
      const c = S.account, who = val('cpayer') || 'A customer', amt = num(val('camt'));
      if (!(amt > 0)) return bad('Enter the amount the customer paid.');
      D.bal[c] += amt; D.collectedMonth += amt * rate[c]; D.months[5][1] += amt * rate[c] / 1e6;
      addTx(who, 'Collection · ' + c, signed(c, amt), 'Collection', ['ok', 'Credited']); addAudit('Money', 'Credited ' + money(c, amt) + ' from ' + who, 'Received on the ' + c + ' collection account', 'System');
      const cust = D.customers.find((x) => x[1].toLowerCase() === who.toLowerCase() && x[2] === c); if (cust) cust[4] = money(c, num(cust[4]) + amt);
      if (D.hookSaved && D.hookEvents['collection.credited']) D.deliveries.unshift([now(), 'collection.credited', '200 OK', '1']);
      S.formErr = ''; render(); toast(money(c, amt) + ' from ' + who + ' credited to your ' + c + ' wallet.');
    },
    upload: () => { D.held = false; D.bal.USD += 2950; D.tx.forEach((t) => { if (t.who === 'Atlantic Textiles Inc') t.st = ['ok', 'Credited']; }); addAudit('Money', 'Uploaded invoice for $2,950.00 from Atlantic Textiles Inc'); render(); toast('Invoice uploaded. The payment has been released to your USD wallet.'); },
    sendFromOverview: () => { S.payMode = 'single'; S.sendStage = 'form'; if (!D.recips.length) S.recip = 'new'; go('pay'); },
    payMode: (v) => { S.payMode = v; S.formErr = ''; if (S.page !== 'pay') go('pay'); else render(); },
    recip: (v) => { S.recip = v; S.formErr = ''; render(); },
    sendReview: () => {
      if (S.recip === 'new' && (!S.newName || !S.newAcct)) return bad('Add the name and account or phone number of the person you\'re paying.');
      if (!(S.sendAmt > 0)) return bad('Enter an amount to send.');
      if (S.sendAmt * (1 + FEE) > D.bal[S.sendFrom]) return bad('Not enough in your ' + S.sendFrom + ' wallet. You need ' + money(S.sendFrom, S.sendAmt * (1 + FEE)) + ' including the fee. Fund your wallet first.');
      S.formErr = ''; S.sendStage = 'review'; render(true);
    },
    sendEdit: () => { S.sendStage = 'form'; render(); },
    sendConfirm: () => {
      if (gated()) return;
      const q = quote();
      D.bal[S.sendFrom] -= S.sendAmt * (1 + FEE);
      if (S.recip === 'new') { const id = 'r' + Date.now(); D.recips.push({ id, name: q.r.name, where: q.r.where, cur: q.r.cur, eta: q.r.eta, place: q.r.place }); S.recip = id; S.newName = ''; S.newAcct = ''; }
      const r = recipient();
      S.lastSend = { name: r.name, place: r.place, eta: r.eta, from: S.sendFrom, got: money(r.cur, q.get) };
      const needs = q.ngn > 5000000 && S.rule;
      D.singles.unshift([now(), r.name, r.where, money(r.cur, q.get), needs ? 'Pending approval' : 'Delivered']);
      addTx(r.name, 'Payout · ' + r.cur, '−' + money(r.cur, q.get), 'Payout', needs ? ['warn', 'Pending approval'] : ['ok', 'Delivered']);
      addAudit('Money', (needs ? 'Submitted' : 'Sent') + ' ' + money(S.sendFrom, S.sendAmt) + ' to ' + r.name + ' (fee ' + money(S.sendFrom, S.sendAmt * FEE) + ')');
      if (!needs && D.hookSaved && D.hookEvents['payout.completed']) D.deliveries.unshift([now(), 'payout.completed', '200 OK', '1']);
      S.sendStage = needs ? 'approval' : 'sent'; render(true); toast(needs ? 'Sent for approval. The money is reserved.' : 'Sent. You can track it in Recent single payments.');
    },
    sendApprove: () => { D.singles[0][4] = 'Delivered'; D.tx[0].st = ['ok', 'Delivered']; addAudit('Money', 'Approved the payment to ' + S.lastSend.name, 'Second approver (demo)'); S.sendStage = 'sent'; render(true); toast('Approved and sent.'); },
    sendAgain: () => { S.sendStage = 'form'; S.sendAmt = 0; render(true); },
    newRun: () => {
      if (gated()) return;
      S.payMode = 'bulk';
      D.bulk = { name: 'Supplier run · ' + now().slice(0, 6), file: 'payees.csv', by: owner(), status: 'draft', payees: [['Kwame Mensah', 'Ghana', 'MTN Mobile Money', 'GHS 1,500', Math.round(1500 * rate.GHS)], ['Wanjiru Kamau', 'Kenya', 'M-Pesa', 'KES 20,000', Math.round(20000 * rate.KES)], ['Bello Logistics Ltd', 'Nigeria', 'Bank transfer', '₦150,000', 150000], ['Thames Freight Ltd', 'United Kingdom', 'Faster Payments', '£200', Math.round(200 * rate.GBP)]] };
      addAudit('Money', 'Uploaded payees.csv with 4 payees');
      if (S.page !== 'pay') go('pay'); else render(); toast('payees.csv uploaded: 4 payees checked, 0 errors.');
    },
    submit: () => { D.bulk.status = 'pending'; addAudit('Money', 'Submitted ' + D.bulk.name + ' for approval'); render(); toast('Submitted for approval.'); },
    reject: () => { D.bulk.status = 'draft'; addAudit('Money', 'Sent ' + D.bulk.name + ' back to the preparer'); render(); toast('Sent back with your note.'); },
    approve: () => {
      if (gated()) return;
      const t = bulkTotal() * (1 + FEE);
      if (t > D.bal.NGN) return bad('Not enough in your NGN wallet. This run needs ' + money('NGN', t) + ' including fees.');
      D.bal.NGN -= t; D.bulk.status = 'sent'; S.formErr = '';
      addTx(D.bulk.name, 'Payout run · ' + D.bulk.payees.length + ' payees', '−' + money('NGN', bulkTotal()), 'Payout', ['ok', 'Paid']); addAudit('Money', 'Approved ' + D.bulk.name + ' (' + money('NGN', bulkTotal()) + ', fee ' + money('NGN', bulkTotal() * FEE) + ')');
      render(); toast('Approved. ' + D.bulk.payees.length + ' payouts are on their way.');
    },
    earnCur: (v) => { S.earnCur = v; S.formErr = ''; render(); },
    sweep: () => { S.sweep = !S.sweep; render(); },
    saveFloor: () => { S.floor[S.earnCur] = num(val('floor')); addAudit('Earn', 'Set the ' + S.earnCur + ' floor to ' + money(S.earnCur, S.floor[S.earnCur])); render(); toast('Sweep rule saved.'); },
    sweepNow: () => {
      if (gated()) return;
      const c = S.earnCur; S.floor[c] = num(val('floor'));
      if (!S.sweep) return bad('Turn the evening sweep on first.');
      const amt = D.bal[c] - S.floor[c];
      if (amt <= 0) return bad('Nothing to sweep. Your ' + c + ' wallet is at or below the floor of ' + money(c, S.floor[c]) + '.');
      D.bal[c] -= amt; D.earn[c] += amt; S.formErr = '';
      D.earnHist.unshift([now().slice(0, 6), 'Evening sweep', 'Sweep', signed(c, amt), 'Done']); addTx('Evening sweep', 'Earn · ' + c, money(c, amt), 'Earn', ['info', 'Swept']); addAudit('Earn', 'Swept ' + money(c, amt) + ' into Earn', 'Floor ' + money(c, S.floor[c]), 'System');
      render(); toast(money(c, amt) + ' moved into Earn.');
    },
    wd: (v) => { S.wd = v; render(); },
    withdraw: () => {
      if (gated()) return;
      const c = S.earnCur, amt = num(val('wamt'));
      if (!(amt > 0)) return bad('Enter an amount to withdraw.');
      if (amt > D.earn[c]) return bad('You have ' + money(c, D.earn[c]) + ' in Earn.');
      const fee = S.wd === 'instant' ? amt * FEE : 0;
      D.earn[c] -= amt; D.bal[c] += amt - fee; S.formErr = '';
      D.earnHist.unshift([now().slice(0, 6), S.wd === 'instant' ? 'Instant withdrawal (fee ' + money(c, fee) + ')' : 'Notice withdrawal', S.wd === 'instant' ? 'Instant withdrawal' : 'Notice withdrawal', '−' + money(c, amt), 'Back in wallet']);
      addTx(S.wd === 'instant' ? 'Instant withdrawal' : 'Notice withdrawal', 'Earn · ' + c, signed(c, amt - fee), 'Earn', ['ok', 'Back in wallet']); addAudit('Earn', (S.wd === 'instant' ? 'Instant' : 'Notice') + ' withdrawal of ' + money(c, amt) + (fee ? ' (fee ' + money(c, fee) + ')' : ''));
      render(); toast(S.wd === 'instant' ? money(c, amt - fee) + ' is back in your wallet after the 2% fee.' : money(c, amt) + ' is back in your wallet (in this demo, notice withdrawals settle straight away).');
    },
    fakeHistory: () => { D.loanEligible = true; D.months = [['May', 1.2], ['Jun', 1.8], ['Jul', 2.4], ['Aug', 2.1], ['Sep', 2.9], ['Oct', Math.max(3.3, D.collectedMonth / 1e6)]]; addAudit('Money', 'Loan eligibility unlocked (demo: 3 months of history added)', 'Demo shortcut', 'System'); render(); toast('Demo: 3 months of collection history added. Loans are now available.'); },
    loanProduct: (v) => { S.loanProduct = v; render(); },
    applyLoan: () => { if (gated()) return; const n = 'LN-' + digits(4); D.loans.unshift([n, { line: 'Earn-backed credit line', invoice: 'Invoice financing', revenue: 'Working capital' }[S.loanProduct], '₦' + S.loanAmt + ',000,000', S.loanTerm + ' months', 'In review', 'Applied ' + now()]); addAudit('Money', 'Applied for loan ' + n + ' (₦' + S.loanAmt + ',000,000)'); render(); toast('Application sent. We\'ll confirm the offer within 1 business day.'); },
    freeze: (v) => { const c = D.cards[Number(v)]; c[6] = !c[6]; addAudit('Cards', (c[6] ? 'Froze' : 'Unfroze') + ' card ending ' + c[2]); render(); toast(c[6] ? 'Card ending ' + c[2] + ' frozen.' : 'Card ending ' + c[2] + ' unfrozen.'); },
    issueCard: () => { if (gated()) return; const n = val('cname'), lim = num(val('clim')); if (!n || !(lim > 0)) return bad('Add a card name and a monthly limit.'); const last = digits(4); D.cards.unshift([n, val('cholder'), last, 0, lim, val('ccat'), false]); addAudit('Cards', 'Issued ' + n + ' card ending ' + last + ' to ' + val('cholder') + ' ($' + lim + ' a month)'); S.formErr = ''; render(); toast('Card ending ' + last + ' issued to ' + val('cholder') + '.'); },
    addCustomer: () => { const n = val('custname'), c = val('custcur'); if (!n) return bad('Add the customer\'s name.'); const last = digits(4); D.customers.unshift([initials(n), n, c, c + ' ending ' + last, money(c, 0), 'No open invoices']); addAudit('Money', 'Created a ' + c + ' customer account for ' + n); S.formErr = ''; render(); toast('Customer account created for ' + n + '. Share its details with them.'); },
    match: () => { S.match = !S.match; render(); },
    rule: () => { S.rule = !S.rule; addAudit('Settings', (S.rule ? 'Turned on' : 'Turned off') + ' two approvers above ₦5,000,000'); render(); },
    twofa: () => { S.twofa = !S.twofa; addAudit('Settings', (S.twofa ? 'Turned on' : 'Turned off') + ' two-step sign-in'); render(); },
    notif: (v) => { S.notif[v] = !S.notif[v]; render(); },
    regen: () => { S.regen = true; render(); },
    regenCancel: () => { S.regen = false; render(); },
    regenConfirm: () => { D.key = 'sk_test_' + rnd(24); S.regen = false; S.keyShown = true; addAudit('Developers', 'Regenerated the test API key'); render(); toast('New key created. The old key no longer works.'); },
    keySaved: () => { S.keyShown = false; render(); },
    ipAllow: () => { S.ipAllow = !S.ipAllow; addAudit('Developers', (S.ipAllow ? 'Turned on' : 'Turned off') + ' IP allowlist enforcement'); render(); },
    ipAdd: () => {
      const ip = val('ipnew'), label = val('iplabel') || 'No label';
      if (!/^(25[0-5]|2[0-4]\d|1?\d?\d)(\.(25[0-5]|2[0-4]\d|1?\d?\d)){3}(\/(3[0-2]|[12]?\d))?$/.test(ip)) { S.ipErr = 'Enter an IPv4 address like 102.89.34.18, or a range like 41.58.120.0/24.'; render(); return; }
      if (D.ips.some((x) => x[0] === ip)) { S.ipErr = ip + ' is already on the list.'; render(); return; }
      S.ipErr = ''; D.ips.push([ip, label]); addAudit('Developers', 'Added ' + ip + ' to the IP allowlist'); render(); toast(ip + ' added to the allowlist.');
    },
    ipRemove: (v) => { const ip = D.ips[Number(v)][0]; D.ips.splice(Number(v), 1); addAudit('Developers', 'Removed ' + ip + ' from the IP allowlist'); render(); toast(ip + ' removed.'); },
    hookEvent: (v) => { D.hookUrl = val('hook'); D.hookEvents[v] = !D.hookEvents[v]; D.hookSaved = false; render(); },
    hookSecret: () => { D.hookSecret = 'whsec_' + rnd(8); addAudit('Developers', 'Regenerated the webhook signing secret'); render(); toast('New signing secret created. Update it on your server.'); },
    hookSave: () => {
      const url = val('hook'); D.hookUrl = url;
      if (!/^https:\/\/[^\s/]+\.[^\s]+/.test(url)) { S.hookErr = 'Enter a full https:// address for your endpoint.'; D.hookSaved = false; render(); return; }
      if (!Object.values(D.hookEvents).some(Boolean)) { S.hookErr = 'Choose at least one event to send.'; D.hookSaved = false; render(); return; }
      S.hookErr = ''; D.hookSaved = true; addAudit('Developers', 'Saved webhook endpoint ' + url); render(); toast('Webhook saved. You can send a test event now.');
    },
    hookTest: () => { if (!D.hookSaved) return; const ev = val('testev'); S.testEvent = ev; D.deliveries.unshift([now(), ev, '200 OK', '1']); addAudit('Developers', 'Sent a test ' + ev + ' event'); render(); toast('Test event ' + ev + ' sent to ' + D.hookUrl + ' and returned 200 OK (demo).'); }
  };
  document.addEventListener('click', (e) => { if (e.target.closest('#ob')) return; const b = e.target.closest('[data-a]'); if (b && A[b.dataset.a] && !b.disabled) { e.preventDefault(); A[b.dataset.a](b.dataset.v); } });
  document.addEventListener('input', (e) => {
    if (e.target.closest('#ob')) return;
    const t = e.target, id = t.id;
    if (t.dataset && t.dataset.tq) {
      const k = t.dataset.tq; TB[k].q = t.value; TB[k].page = 0; const pos = t.selectionStart; render();
      const el = document.getElementById('q-' + k); if (el) { el.focus(); try { el.setSelectionRange(pos, pos); } catch (x) {} }
      return;
    }
    const set = (i, v) => { const n = document.getElementById(i); if (n) n.textContent = v; };
    if (id === 'lamt') { S.loanAmt = Number(t.value); set('lamtlab', 'Amount: ₦' + S.loanAmt + ',000,000'); set('lmon', '₦' + (S.loanAmt * 1000000 / S.loanTerm).toLocaleString('en-NG', { maximumFractionDigits: 0 })); }
    if (id === 'samt') { S.sendAmt = num(t.value); const q = quote(); set('sget', money(q.r.cur, q.get)); set('sfee', money(S.sendFrom, S.sendAmt * FEE)); set('stot', money(S.sendFrom, S.sendAmt * (1 + FEE))); }
    if (id === 'famt') { const a = num(t.value); set('ffee', money(S.fundCur, a * FEE)); set('fnet', money(S.fundCur, a * (1 - FEE))); }
    if (id === 'wamt') { set('wfee', '2% fee · ' + money(S.earnCur, num(t.value) * FEE)); }
    if (id === 'nname') S.newName = t.value.trim();
    if (id === 'nacct') S.newAcct = t.value.trim();
    if (id === 'hook') D.hookUrl = t.value;
  });
  document.addEventListener('change', (e) => {
    if (e.target.closest('#ob')) return;
    const t = e.target, id = t.id;
    if (t.dataset && t.dataset.tf) { TB[t.dataset.tf].f = t.value; TB[t.dataset.tf].page = 0; render(); return; }
    if (id === 'lterm') { S.loanTerm = Number(t.value); render(); }
    if (id === 'sfrom') { S.sendFrom = t.value; render(); }
    if (id === 'ncountry') { S.newCur = t.value; S.newType = ''; render(); }
    if (id === 'ntype') S.newType = t.value;
    if (id === 'testev') S.testEvent = t.value;
  });
  document.addEventListener('submit', (e) => {
    if (e.target.closest('#ob')) return;
    e.preventDefault();
    if (e.target.id === 'invite') {
      const n = val('iname'), em = val('iemail'), role = val('irole');
      if (!n || !/^\S+@\S+\.\S+$/.test(em)) return bad('Add their full name and a valid work email.');
      D.team.push([initials(n), n, em, role, role === 'Viewer' ? 'Read only' : role === 'Preparer' ? 'Prepares only' : '₦20,000,000 a day', 'Invited']);
      addAudit('Team', 'Invited ' + n + ' (' + em + ') as ' + role); S.formErr = ''; render(); toast('Invite sent to ' + em + '. It shows in the audit trail.');
    }
    if (e.target.id === 'profile') { addAudit('Settings', 'Updated the business profile'); toast('Profile saved. The change is in the audit trail.'); }
  });

  window.obMode = (mode, acct) => {
    const key = acct.key === 'signup' ? 'signup:' + acct.email : acct.key;
    if (!DATA[key]) DATA[key] = mode === 'demo' ? demoData() : freshData(acct);
    else DATA[key].audit.unshift([now(), (acct.first + ' ' + acct.last).trim(), 'Login', 'Signed in with two-step code', 'Chrome · Lagos', '102.89.34.18', 'Not available (browser)']);
    D = DATA[key]; S.acct = acct; S.page = 'overview'; S.payMode = 'single'; S.sendStage = 'form'; S.sendAmt = 0; S.recip = D.recips.length ? D.recips[0].id : 'new'; S.formErr = ''; S.keyShown = false; S.regen = false;
    Object.keys(TB).forEach((k) => delete TB[k]);
  };
  window.obKyb = (status) => { const was = S.kyb; S.kyb = status; if (status === 'submitted' && was !== 'submitted' && D.mode === 'fresh') addAudit('Verification', 'Submitted business verification (KYB)'); };
  window.obHostShow = (app) => { document.getElementById('ob').hidden = app; document.querySelector('.app').hidden = !app; toastEl.hidden = true; if (app) { render(true); window.scrollTo(0, 0); } };
  window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (pages[h] && h !== S.page) go(h); });
  render(true);
  window.OB.start('welcome');
})();
</script>

</body>
