<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Misan Business Web Concept</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Poppins:wght@400;500;600;700&display=swap">
<style>
/* Layout: a business dashboard. Fixed dark sidebar on desktop, a scrolling tab strip on phones. Single committed light look. */
:root {
  --ink: #1C0045;
  --lime: #D9FF1F;
  --violet: #7A00E6;
  --violet-deep: #5A00AA;
  --lilac: #F0E6FF;
  --paper: #FFFFFF;
  --ground: #F6F5F9;
  --mist: #F1F0F5;
  --line: #E8E6EF;
  --text: #1C1C1E;
  --muted: #5F5F6B;
  --ok: #2E7D1F;
  --ok-bg: #E7F4E2;
  --warn: #8A4B0B;
  --warn-bg: #FFF3DD;
  --bad: #B3261E;
  --bad-bg: #FDECEA;
  --display: 'Archivo Black', 'Arial Black', 'Helvetica Neue', sans-serif;
  --body: 'Poppins', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono: ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
  color-scheme: light;
}
html, body { height: 100%; }
body { background: var(--ground); color: var(--text); font-family: var(--body); font-size: 14px; }
button, input, select { font-family: inherit; font-size: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--violet); outline-offset: 2px; }
.banner { background: var(--ink); color: var(--lime); font-size: 12px; font-weight: 600; text-align: center; padding-block: 7px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.app { display: grid; grid-template-columns: 236px minmax(0, 1fr); min-height: calc(100% - 32px); }
.side { background: var(--ink); color: #EDE6FA; padding: 20px 14px; display: flex; flex-direction: column; gap: 4px; position: sticky; top: 0; height: calc(100vh - 32px); box-sizing: border-box; overflow-y: auto; }
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 18px; }
.brand .mark { width: 34px; height: 34px; border-radius: 10px; background: var(--lime); color: var(--ink); display: grid; place-items: center; font-weight: 700; font-size: 13px; }
.brand b { display: block; font-size: 14px; }
.brand span { font-size: 11px; color: #B9A8DA; }
.navgroup { font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: #9C8CC0; padding: 14px 10px 6px; }
.nav { border: none; background: none; color: #DCD3EE; text-align: left; padding: 9px 10px; border-radius: 10px; font-weight: 500; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.nav:hover { background: rgba(255,255,255,.06); }
.nav[aria-current="page"] { background: var(--lime); color: var(--ink); font-weight: 700; }
.nav .count { font-size: 11px; font-weight: 700; background: var(--violet); color: #fff; border-radius: 999px; padding: 1px 7px; }
.nav[aria-current="page"] .count { background: var(--ink); color: var(--lime); }
.main { min-width: 0; display: flex; flex-direction: column; }
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-block: 14px; padding-left: max(28px, env(safe-area-inset-left, 0px)); padding-right: max(28px, env(safe-area-inset-right, 0px)); background: var(--paper); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.search { flex: 1; max-width: 420px; min-width: 180px; display: flex; align-items: center; gap: 8px; background: var(--mist); border-radius: 12px; padding: 0 12px; }
.search input { border: none; background: none; height: 40px; width: 100%; outline: none; }
.who { display: flex; align-items: center; gap: 12px; }
.bell { position: relative; width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--line); background: var(--paper); display: grid; place-items: center; }
.bell i { position: absolute; top: 8px; right: 9px; width: 8px; height: 8px; border-radius: 999px; background: var(--violet); }
.avatar { width: 36px; height: 36px; border-radius: 999px; background: var(--lilac); color: var(--violet-deep); display: grid; place-items: center; font-weight: 700; font-size: 13px; flex-shrink: 0; }
.content { padding-block: 26px 48px; padding-left: max(28px, env(safe-area-inset-left, 0px)); padding-right: max(28px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 20px; max-width: 1180px; width: 100%; box-sizing: border-box; }
.head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
h1 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 34px; line-height: 1.02; color: var(--ink); text-wrap: balance; }
.lede { margin: 6px 0 0; color: var(--muted); max-width: 62ch; line-height: 1.5; }
h2 { margin: 0; font-size: 16px; font-weight: 700; }
.small { font-size: 12px; color: var(--muted); }
.num { font-variant-numeric: tabular-nums; }
.grid { display: grid; gap: 16px; }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g21 { grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); }
.panel { background: var(--paper); border: 1px solid var(--line); border-radius: 18px; padding: 18px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.panel .ph { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.tile { background: var(--paper); border: 1px solid var(--line); border-radius: 18px; padding: 16px 18px; display: flex; flex-direction: column; gap: 6px; }
.tile .lab { font-size: 12px; color: var(--muted); font-weight: 500; }
.tile .val { font-family: var(--display); font-size: 24px; color: var(--ink); }
.tile.hero { background: var(--violet); border-color: var(--violet); color: #fff; }
.tile.hero .lab, .tile.hero .small { color: #EBDDFF; }
.tile.hero .val { color: #fff; }
.tile.dark { background: var(--ink); border-color: var(--ink); color: #fff; }
.tile.dark .lab, .tile.dark .small { color: #C9BCE6; }
.tile.dark .val { color: var(--lime); }
.pill { display: inline-block; font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 999px; white-space: nowrap; }
.ok { background: var(--ok-bg); color: var(--ok); }
.warn { background: var(--warn-bg); color: var(--warn); }
.bad { background: var(--bad-bg); color: var(--bad); }
.info { background: var(--lilac); color: var(--violet-deep); }
.grey { background: #ECECF1; color: #3D3D47; }
.new { background: var(--lime); color: var(--ink); }
.btn { min-height: 42px; padding: 0 18px; border-radius: 12px; border: none; background: var(--ink); color: var(--lime); font-weight: 600; white-space: nowrap; }
.btn.ghost { background: var(--paper); color: var(--ink); border: 1.5px solid var(--ink); }
.btn.soft { background: var(--lilac); color: var(--violet-deep); }
.btn.sm { min-height: 34px; padding: 0 12px; font-size: 13px; border-radius: 10px; }
.btns { display: flex; gap: 10px; flex-wrap: wrap; }
.tablewrap { overflow-x: auto; margin: 0 -18px; padding: 0 18px; }
table { width: 100%; border-collapse: collapse; min-width: 560px; }
th { text-align: left; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 600; padding: 0 12px 10px 0; border-bottom: 1px solid var(--line); }
td { padding: 12px 12px 12px 0; border-bottom: 1px solid var(--line); vertical-align: middle; }
tr:last-child td { border-bottom: none; }
td.r, th.r { text-align: right; }
td .sub { display: block; font-size: 12px; color: var(--muted); }
tr.click { cursor: pointer; }
tr.click:hover td { background: #FAF8FE; }
.code { width: 36px; height: 36px; border-radius: 999px; background: var(--lilac); color: var(--violet-deep); display: inline-grid; place-items: center; font-size: 11px; font-weight: 700; flex-shrink: 0; }
.cell { display: flex; align-items: center; gap: 10px; }
.tog { flex-shrink: 0; width: 46px; height: 28px; border: none; border-radius: 999px; padding: 3px; background: #C4C4CC; display: flex; justify-content: flex-start; transition: background .15s; }
.tog::after { content: ""; width: 22px; height: 22px; border-radius: 999px; background: #fff; }
.tog[aria-pressed="true"] { background: var(--violet); justify-content: flex-end; }
.setrow { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.setrow:last-child { border-bottom: none; }
.setrow .t { font-weight: 600; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-size: 12px; font-weight: 600; color: var(--muted); }
.field input, .field select { height: 42px; border: 1.5px solid var(--line); border-radius: 10px; padding: 0 12px; background: var(--paper); }
.field input:focus, .field select:focus { border-color: var(--violet); outline: none; }
input[type="range"] { accent-color: var(--violet); width: 100%; }
.opts { display: grid; gap: 10px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
.opt { border: 2px solid var(--line); border-radius: 14px; background: var(--paper); padding: 14px; text-align: left; display: flex; flex-direction: column; gap: 4px; }
.opt[aria-pressed="true"] { border-color: var(--violet); background: #FBF8FF; }
.opt .t { font-weight: 700; }
.recips .opt { flex-direction: row; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 14px; }
.panel .btn.primary, .panel .btn.secondary { align-self: flex-start; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { border: 1.5px solid var(--line); background: var(--paper); border-radius: 999px; padding: 6px 14px; font-weight: 600; font-size: 13px; }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--lime); }
.kv { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.kv:last-child { border-bottom: none; }
.kv .k { color: var(--muted); }
.kv .v { font-weight: 700; text-align: right; }
.steps { display: flex; flex-direction: column; }
.step { display: flex; gap: 12px; }
.rail { display: flex; flex-direction: column; align-items: center; width: 14px; flex-shrink: 0; }
.dot { width: 12px; height: 12px; border-radius: 999px; box-sizing: border-box; border: 3px solid; margin-top: 4px; }
.line { flex: 1; width: 2px; min-height: 18px; background: var(--line); }
.step:last-child .line { visibility: hidden; }
.step .body { padding-bottom: 12px; display: flex; flex-direction: column; gap: 1px; }
.d-done { border-color: var(--ok); background: var(--ok); }
.d-now { border-color: var(--violet); background: #fff; }
.d-hold { border-color: #C77B1C; background: #fff; }
.d-todo { border-color: #C4C4CC; background: #fff; }
.note { background: var(--warn-bg); color: var(--warn); border-radius: 14px; padding: 14px 16px; line-height: 1.5; }
.note.violet { background: var(--lilac); color: var(--violet-deep); }
.term { background: var(--ink); color: #EDE6FA; border-radius: 14px; padding: 16px; font-family: var(--mono); font-size: 12.5px; line-height: 1.7; overflow-x: auto; }
.term .m { color: var(--lime); }
.chart svg { width: 100%; height: auto; display: block; }
.bar-track { height: 8px; border-radius: 999px; background: var(--mist); overflow: hidden; }
.bar-track span { display: block; height: 100%; background: var(--violet); }
.toast { position: fixed; right: max(24px, env(safe-area-inset-right, 0px)); bottom: calc(24px + env(safe-area-inset-bottom, 0px)); max-width: min(380px, calc(100% - 48px)); background: var(--ink); color: #fff; border-radius: 14px; padding: 14px 16px; line-height: 1.45; box-shadow: 0 14px 34px -12px rgba(28,0,69,.55); z-index: 20; }
@media (max-width: 1100px) { .g4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .g21 { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 860px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .side { position: static; height: auto; flex-direction: row; overflow-x: auto; padding: 10px max(12px, env(safe-area-inset-right, 0px)) 10px max(12px, env(safe-area-inset-left, 0px)); gap: 6px; }
  .brand, .navgroup { display: none; }
  .nav { white-space: nowrap; flex-shrink: 0; }
  .g3, .g2, .opts { grid-template-columns: minmax(0, 1fr); }
  .content, .topbar { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  h1 { font-size: 28px; }
}
@media (max-width: 520px) { .g4 { grid-template-columns: minmax(0, 1fr); } .who .name { display: none; } }
@media (prefers-reduced-motion: reduce) { .tog { transition: none; } }
</style>
</head>
<body>

<div class="banner">Concept by Chiamaka Obioha · not an official Misan product · all figures are samples</div>
<div class="app">
  <nav class="side" id="side" aria-label="Main"></nav>
  <div class="main">
    <header class="topbar">
      <label class="search"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5F5F6B" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="q" type="search" placeholder="Search payments, payees, customers" aria-label="Search"></label>
      <div class="who">
        <button class="bell" data-a="bell" aria-label="Notifications, 3 new"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1C0045" stroke-width="2"><path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4zM10 20h4"/></svg><i></i></button>
        <span class="avatar">KO</span>
        <span class="name"><b style="display:block;font-size:13px">Kola Ogun</b><span class="small">Owner · Kola Exports Ltd</span></span>
      </div>
    </header>
    <main class="content" id="view"></main>
  </div>
</div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
(function () {
  const S = { payMode: 'single', recip: 'kwame', sendFrom: 'NGN', sendAmt: 500000, sendStage: 'form', newCur: 'GHS', newName: '', newType: '', fundCur: 'NGN', fundMethod: 'transfer', page: 'overview', run: 'pending', earnCur: 'NGN', sweep: true, floor: '2,000,000', wd: 'notice', loanProduct: 'line', loanAmt: 10, loanTerm: 6, loanStatus: 'none',
    rule: true, twofa: true, ipAllow: false, notif: { email: true, push: true, sms: false, webhook: true }, frozen: {}, match: true, opened: {}, auditFilter: 'All', invited: false, held: true, account: 'GBP' };

  const nav = [
    ['Money', [['overview', 'Overview'], ['fund', 'Fund wallet'], ['collect', 'Collect'], ['pay', 'Pay', () => S.run === 'pending' ? 1 : 0], ['earn', 'Earn'], ['loans', 'Loans']]],
    ['Business', [['cards', 'Cards'], ['customers', 'Customers'], ['team', 'Team'], ['audit', 'Audit trail']]],
    ['Setup', [['setup', 'Settings'], ['developers', 'Developers']]]
  ];
  const pill = (cls, t) => `<span class="pill ${cls}">${t}</span>`;
  const tog = (a, label, on, v) => `<button class="tog" data-a="${a}"${v ? ` data-v="${v}"` : ''} aria-pressed="${on}" aria-label="${label}"></button>`;
  const head = (title, lede, actions) => `<div class="head"><div><h1>${title}</h1>${lede ? `<p class="lede">${lede}</p>` : ''}</div>${actions ? `<div class="btns">${actions}</div>` : ''}</div>`;

  const balances = [['NGN', '₦4,250,000', '₦12,450,000'], ['USD', '$8,215.40', '$15,200.00'], ['GBP', '£12,480.00', '£0.00'], ['EUR', '€3,960.00', '€0.00'], ['CAD', 'CA$2,140.00', 'CA$0.00']];
  const accounts = [
    ['GBP', 'British Pound', 'United Kingdom', 'Faster Payments', true, [['Sort code', '12-34-56'], ['Account number', '12345678']]],
    ['USD', 'US Dollar', 'United States', 'ACH or wire', true, [['Routing number', '123456789'], ['Account number', '000123456789']]],
    ['EUR', 'Euro', 'Eurozone', 'SEPA', true, [['IBAN', 'BE00 1234 5678 9012'], ['BIC', 'SAMPBEBB']]],
    ['NGN', 'Nigerian Naira', 'Nigeria', 'NIP bank transfer', true, [['Account number', '0123456789'], ['Bank', '[Partner MFB]']]],
    ['CAD', 'Canadian Dollar', 'Canada', 'Interac e-Transfer, EFT', true, [['Institution', '000'], ['Account number', '1234567']]],
    ['GHS', 'Ghanaian Cedi', 'Ghana', 'Bank or mobile money', false, [['Account number', '1234567890123']]],
    ['KES', 'Kenyan Shilling', 'Kenya', 'Bank or M-Pesa', false, [['M-Pesa Paybill', '123456']]]
  ];
  const activity = () => [
    ['27 Oct, 09:16', 'Brightway Foods Ltd', 'Collection · GBP', '+£4,200.00', pill('ok', 'Credited')],
    ['27 Oct, 08:05', 'Atlantic Textiles Inc', 'Collection · USD', '+$2,950.00', S.held ? pill('warn', 'On hold') : pill('info', 'In review')],
    ['26 Oct, 18:00', 'Evening sweep', 'Earn · NGN', '₦2,180,000', pill('info', 'Swept')],
    ['26 Oct, 10:42', 'Lekki Fresh Market', 'Collection · NGN', '+₦1,850,000', pill('ok', 'Credited')],
    ['25 Oct, 12:00', 'Staff payroll', 'Payout run · 18 payees', '−₦8,400,000', pill('ok', 'Paid')]
  ];

  // Sample monthly collections in ₦ millions, to scale.
  const months = [['May', 18.2], ['Jun', 21.4], ['Jul', 19.8], ['Aug', 26.1], ['Sep', 29.5], ['Oct', 33.9]];
  function chart() {
    const W = 560, H = 210, L = 40, B = 30, T = 14, max = 40, step = 10;
    const bw = (W - L - 10) / months.length;
    const y = (v) => T + (H - T - B) * (1 - v / max);
    let g = '';
    for (let v = 0; v <= max; v += step) g += `<line x1="${L}" x2="${W - 4}" y1="${y(v)}" y2="${y(v)}" stroke="#E8E6EF"/><text x="${L - 8}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="#5F5F6B">${v}</text>`;
    months.forEach((m, i) => {
      const x = L + i * bw + bw * 0.2, w = bw * 0.6, last = i === months.length - 1;
      g += `<rect x="${x}" y="${y(m[1])}" width="${w}" height="${y(0) - y(m[1])}" rx="5" fill="${last ? '#7A00E6' : '#CDB4F5'}"/>`;
      g += `<text x="${x + w / 2}" y="${H - 10}" text-anchor="middle" font-size="11" fill="#5F5F6B">${m[0]}</text>`;
      if (last) g += `<text x="${x + w / 2}" y="${y(m[1]) - 6}" text-anchor="middle" font-size="12" font-weight="700" fill="#1C0045">₦${m[1]}m</text>`;
    });
    return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Collections rose from ₦18.2 million in May to ₦33.9 million in October (sample)">${g}</svg>`;
  }

  const fundInfo = {
    NGN: { sym: '₦', amt: '5,000,000', lines: [['Account number', '0123456789'], ['Bank', '[Partner MFB]'], ['Account name', 'KOLA EXPORTS LTD - MISAN']], via: 'any Nigerian bank app or internet banking', fee: '2% of the amount', when: 'usually within a minute' },
    USD: { sym: '$', amt: '5,000', lines: [['Routing number', '123456789'], ['Account number', '000123456789'], ['Account name', 'KOLA EXPORTS LTD']], via: 'ACH or wire from a US bank', fee: 'free for ACH', when: '1 to 2 business days' },
    GBP: { sym: '£', amt: '3,000', lines: [['Sort code', '12-34-56'], ['Account number', '12345678'], ['Account name', 'KOLA EXPORTS LTD']], via: 'Faster Payments from a UK bank', fee: 'free', when: 'usually within minutes' },
    EUR: { sym: '€', amt: '3,000', lines: [['IBAN', 'BE00 1234 5678 9012'], ['BIC', 'SAMPBEBB'], ['Account name', 'KOLA EXPORTS LTD']], via: 'SEPA from a eurozone bank', fee: 'free', when: 'same day with SEPA Instant' },
    CAD: { sym: 'CA$', amt: '3,000', lines: [['Institution', '000'], ['Account number', '1234567'], ['Account name', 'KOLA EXPORTS LTD']], via: 'Interac e-Transfer or EFT', fee: 'free', when: 'usually within 30 minutes' }
  };


  const FEE = 0.02;
  const num = (s) => Number(String(s).replace(/[^0-9.]/g, '')) || 0;
  const symOf = (s) => String(s).replace(/[0-9.,\s]/g, '');
  const feeOf = (s) => { const v = num(s) * FEE; const sy = symOf(s); return sy + v.toLocaleString('en-GB', { maximumFractionDigits: sy === '₦' ? 0 : 2, minimumFractionDigits: sy === '₦' ? 0 : 2 }); };
  const recips = [
    { id: 'kwame', name: 'Kwame Mensah', where: 'Ghana · MTN Mobile Money · 024 *** 5512', cur: 'GHS', eta: 'Usually within minutes', place: 'Ghana' },
    { id: 'wanjiru', name: 'Wanjiru Kamau', where: 'Kenya · M-Pesa · 0712 *** 448', cur: 'KES', eta: 'Usually within minutes', place: 'Kenya' },
    { id: 'adeyemi', name: 'Adeyemi Packaging Ltd', where: 'Nigeria · Access Bank ending 4410', cur: 'NGN', eta: 'Usually within seconds', place: 'Nigeria' },
    { id: 'thames', name: 'Thames Freight Ltd', where: 'United Kingdom · Faster Payments ending 7781', cur: 'GBP', eta: 'Usually within minutes', place: 'the UK' }
  ];
  const countries = [['GHS', 'Ghana', 'Mobile money or bank'], ['KES', 'Kenya', 'M-Pesa or bank'], ['NGN', 'Nigeria', 'Bank account'], ['GBP', 'United Kingdom', 'Bank account'], ['USD', 'United States', 'Bank account'], ['CAD', 'Canada', 'Bank account or Interac']];
  // Sample rates: naira per unit of each currency.
  const rate = { NGN: 1, USD: 1385, GBP: 1972, EUR: 1610, CAD: 1005, GHS: 142.7, KES: 10.7 };
  const sym = { NGN: '₦', USD: '$', GBP: '£', EUR: '€', CAD: 'CA$', GHS: 'GHS ', KES: 'KES ' };
  const money = (cur, v) => { const whole = cur === 'NGN' || cur === 'KES'; return sym[cur] + v.toLocaleString('en-GB', { minimumFractionDigits: whole ? 0 : 2, maximumFractionDigits: whole ? 0 : 2 }); };

  const viewEl = document.getElementById('view'), sideEl = document.getElementById('side'), toastEl = document.getElementById('toast');
  let tt;

  function renderSide() {
    sideEl.innerHTML = `<div class="brand"><span class="mark">KE</span><span><b>Kola Exports Ltd</b><span>Business account · concept</span></span></div>` +
      nav.map((g) => `<div class="navgroup">${g[0]}</div>` + g[1].map((n) => { const c = n[2] ? n[2]() : 0; return `<button class="nav" data-a="go" data-v="${n[0]}"${S.page === n[0] ? ' aria-current="page"' : ''}>${n[1]}${c ? `<span class="count">${c}</span>` : ''}</button>`; }).join('')).join('');
  }
  function render(top) {
    viewEl.innerHTML = pages[S.page]();
    renderSide();
    if (top) window.scrollTo(0, 0);
    try { if (location.hash.slice(1) !== S.page) history.replaceState(null, '', '#' + S.page); } catch (e) {}
  }
  function go(p) { if (pages[p]) { S.page = p; render(true); } }

  const A = {
    go, toast, noop: () => toast('Setting changed (demo).'),

    sendFromOverview: () => { S.payMode = 'single'; S.sendStage = 'form'; go('pay'); },
    payMode: (v) => { S.payMode = v; if (S.page !== 'pay') go('pay'); else render(); },
    recip: (v) => { S.recip = v; render(); },
    sendReview: () => { if (!(S.sendAmt > 0)) { toast('Enter an amount to send.'); return; } if (S.recip === 'new' && !S.newName) { toast('Add the name on the account first.'); return; } S.sendStage = 'review'; render(true); },
    sendEdit: () => { S.sendStage = 'form'; render(); },
    sendConfirm: () => { const q = quote(); S.sendStage = q.ngn > 5000000 ? 'approval' : 'sent'; render(true); toast(q.ngn > 5000000 ? 'Sent to Tunde for approval.' : 'Sent. You can track it here and on Home.'); },
    sendApprove: () => { S.sendStage = 'sent'; render(true); toast('Approved and sent.'); },
    sendReceipt: () => toast('Receipt copied: share it with your recipient (demo).'),
    sendAgain: () => { S.sendStage = 'form'; S.recip = 'kwame'; render(true); },
    fundCur: (v) => { S.fundCur = v; render(); },
    fundFor: (v) => { S.fundCur = v; go('fund'); },

    },
    bell: () => toast('3 new: payout run to approve, payment on hold, proof of address expiring.'),
    account: (v) => { S.account = v; render(); },
    openAcc: () => { S.opened[S.account] = true; render(); toast('Your ' + S.account + ' account is ready, in the name Kola Exports Ltd.'); },
    upload: () => { S.held = false; render(); toast('Invoice uploaded. Compliance usually reviews within 2 hours.'); },
    approve: () => { S.run = 'sent'; render(); toast('Approved. 12 payouts are on their way.'); },
    reject: () => { S.run = 'draft'; render(); toast('Sent back to Amaka with your note.'); },
    submit: () => { S.run = 'pending'; render(); toast('Submitted. Tunde will get a notification to approve.'); },
    newRun: () => { S.run = 'draft'; render(); toast('suppliers-oct.csv uploaded: 12 payees checked, 0 errors.'); },
    earnCur: (v) => { S.earnCur = v; render(); },
    sweep: () => { S.sweep = !S.sweep; render(); },
    wd: (v) => { S.wd = v; render(); },
    withdraw: () => { const a = document.getElementById('wamt').value; toast(S.wd === 'notice' ? a + ' will be back in your wallet on Wed 28 Oct, free.' : a + ' is back in your wallet now, less the 2% instant fee (' + feeOf(a) + ').'); },
    loanProduct: (v) => { S.loanProduct = v; render(); },
    applyLoan: () => { S.loanStatus = 'review'; render(); toast('Application sent. We\'ll confirm the offer within 1 business day.'); },
    freeze: (v) => { S.frozen[v] = !S.frozen[v]; render(); toast(S.frozen[v] ? 'Card ending ' + v + ' frozen.' : 'Card ending ' + v + ' unfrozen.'); },
    match: () => { S.match = !S.match; render(); },
    rule: () => { S.rule = !S.rule; render(); },
    auditFilter: (v) => { S.auditFilter = v; render(); },
    twofa: () => { S.twofa = !S.twofa; render(); },
    ipAllow: () => { S.ipAllow = !S.ipAllow; render(); },
    notif: (v) => { S.notif[v] = !S.notif[v]; render(); }
  };
  document.addEventListener('click', (e) => { const b = e.target.closest('[data-a]'); if (b && A[b.dataset.a]) { e.preventDefault(); A[b.dataset.a](b.dataset.v); } });
  document.addEventListener('input', (e) => {

  document.addEventListener('input', (e) => {
    const id = e.target.id;
    if (id === 'samt') { S.sendAmt = Number(String(e.target.value).replace(/[^0-9.]/g, '')) || 0; const q = quote(); const g = document.getElementById('sget'); if (g) g.textContent = money(q.r.cur, q.get); const fe = document.getElementById('sfee'); if (fe) fe.textContent = money(S.sendFrom, S.sendAmt * FEE); const to = document.getElementById('stot'); if (to) to.textContent = money(S.sendFrom, S.sendAmt * (1 + FEE)); }
    if (id === 'famt') { const ff = document.getElementById('ffee'); if (ff) ff.textContent = '2% · ' + feeOf(e.target.value); }
    if (id === 'nname') S.newName = e.target.value;
    if (id === 'wamt') { const wf = document.getElementById('wfee'); if (wf) wf.textContent = '2% fee · ' + feeOf(e.target.value); }
  });
  document.addEventListener('change', (e) => {
    const id = e.target.id;
    if (id === 'sfrom') { S.sendFrom = e.target.value; render(); }
    if (id === 'ncountry') { S.newCur = e.target.value; S.newType = ''; render(); }
    if (id === 'ntype') S.newType = e.target.value;
  });
  const start = location.hash.slice(1);
  if (pages[start]) S.page = start;
  window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (pages[h] && h !== S.page) go(h); });
  render(true);
})();
</script>
