<style>
/* Layout: one phone-sized app, full screen on phones, centred in a frame on wider screens. Single committed light look. */

}

.line { flex: 1; width: 2px; min-height: 22px; background: #DADAE0; }
.step:last-child .line { visibility: hidden; }
.step .grow { display: flex; flex-direction: column; gap: 2px; padding-bottom: 14px; }
.d-done { border-color: var(--ok); background: var(--ok); }
.d-now { border-color: var(--violet); background: #fff; }
.d-hold { border-color: #C77B1C; background: #fff; }
.d-todo { border-color: #C4C4CC; background: #fff; }
.hold { background: var(--warn-bg); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 10px; color: var(--warn); }

.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; background: var(--mist); border-radius: 12px; padding: 4px; }
.seg button { min-height: 40px; border: none; border-radius: 9px; background: none; font-size: 14px; font-weight: 600; color: #3D3D47; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--lime); }
.earncard { background: var(--violet); color: #fff; border-radius: 22px; padding: 20px; display: flex; flex-direction: column; gap: 6px; }

.opt { border: 2px solid #E2E2E8; border-radius: 16px; background: #fff; padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; gap: 12px; text-align: left; width: 100%; }
.opt[aria-pressed="true"] { border-color: var(--violet); }

.fee { font-weight: 700; color: var(--warn); }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-size: 12px; font-weight: 600; color: var(--muted); }
.field input, .field select { height: 48px; border: 1.5px solid #E2E2E8; border-radius: 12px; padding: 0 14px; background: #fff; font-family: inherit; font-size: 16px; }
.field input:focus, .field select:focus { border-color: var(--violet); outline: none; }
.methods { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.methods .opt { flex-direction: column; align-items: flex-start; gap: 2px; padding: 12px 14px; }
.recips .opt { gap: 10px; }
.btn.secondary { margin-top: -4px; }
.bar { height: 6px; border-radius: 999px; background: #E2E2E8; overflow: hidden; }
.bar span { display: block; height: 100%; background: var(--violet); }
.term { background: var(--ink); color: #EDE6FA; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 8px; font-family: var(--mono); font-size: 12px; line-height: 1.5; overflow-x: auto; }
.term .m { color: var(--lime); }
.ev { display: flex; justify-content: space-between; gap: 8px; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
.ev code { font-family: var(--mono); }
.toast { position: absolute; left: 18px; right: 18px; bottom: 96px; background: var(--ink); color: #fff; border-radius: 14px; padding: 14px 16px; font-size: 13px; font-weight: 500; line-height: 1.4; box-shadow: 0 10px 30px -10px rgba(28,0,69,.5); }
.tabs { flex-shrink: 0; background: #fff; border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); padding: 8px max(4px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(4px, env(safe-area-inset-left, 0px)); }
.tabs button { min-height: 52px; border: none; background: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #9A9AA5; font-size: 11px; font-weight: 600; }
.tabs button[aria-current="page"] { color: var(--ink); }
@media (prefers-reduced-motion: reduce) { .tog { transition: none; } }
</style>

<body>

<div class="stage">

<script>
(function () {
  const S = { payMode: 'single', recip: 'kwame', sendFrom: 'NGN', sendAmt: 500000, sendStage: 'form', newCur: 'GHS', newName: '', newType: '', fundCur: 'NGN', fundMethod: 'transfer', screen: 'home', cur: 'GBP', pay: 'p1', wallet: 0, opened: {}, convert: { GBP: true }, match: true, held: true,
    run: 'draft', earnCur: 'NGN', sweep: true, wd: 'notice', rule: true, xero: false };

  const ic = {

    up: (c) => `<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 17l5-5 4 4 7-8M15 8h5v5"/></svg>`,
    home: `<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 10.5L12 4l8 6.5V20h-5v-5h-6v5H4z"/></svg>`,

    back: `<svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1C0045" stroke-width="2.2" stroke-linecap="round"><path d="M20 12H4M10 6l-6 6 6 6"/></svg>`,

  };

  const wallets = [
    { code: 'NGN', amount: '₦4,250,000', earn: '₦12,450,000' },
    { code: 'GBP', amount: '£12,480.00', earn: '£0.00' },
    { code: 'USD', amount: '$8,215.40', earn: '$15,200.00' },
    { code: 'EUR', amount: '€3,960.00', earn: '€0.00' }
  ];
  const accounts = [
    { code: 'GBP', name: 'British Pound', country: 'United Kingdom', rails: 'Faster Payments', live: true, lines: [['Sort code', '12-34-56'], ['Account number', '12345678'], ['Bank', '[Partner bank]']] },
    { code: 'USD', name: 'US Dollar', country: 'United States', rails: 'ACH or wire', live: true, lines: [['Routing number', '123456789'], ['Account number', '000123456789'], ['Bank', '[Partner bank]']] },
    { code: 'EUR', name: 'Euro', country: 'Eurozone', rails: 'SEPA', live: true, lines: [['IBAN', 'BE00 1234 5678 9012'], ['BIC', 'SAMPBEBB'], ['Bank', '[Partner bank]']] },
    { code: 'NGN', name: 'Nigerian Naira', country: 'Nigeria', rails: 'NIP bank transfer', live: true, lines: [['Account number', '0123456789'], ['Bank', '[Partner MFB]']] },
    { code: 'GHS', name: 'Ghanaian Cedi', country: 'Ghana', rails: 'bank or mobile money', live: false, lines: [['Account number', '1234567890123'], ['Bank', '[Partner bank]']] },
    { code: 'KES', name: 'Kenyan Shilling', country: 'Kenya', rails: 'bank or M-Pesa', live: false, lines: [['M-Pesa Paybill', '123456'], ['Account number', 'KOLA001']] }
  ];
  const isOn = (a) => a.live || !!S.opened[a.code];

  function payData(id) {
    if (id === 'p1') return { amount: '£4,200.00', from: 'Brightway Foods Ltd', date: '27 Oct 2026', into: 'your GBP account ending 5678', status: 'Credited', tone: 'ok',
      steps: [['Received by UK partner bank', '09:14', 'done'], ['Screening passed', '09:15', 'done'], ['Matched to Brightway Foods', '09:15', 'done'], ['Credited to GBP wallet', '09:16', 'done'], ['Auto-convert 50% to NGN', 'Scheduled for 12:00', 'now']] };
    if (id === 'p2') return S.held
      ? { amount: '$2,950.00', from: 'Atlantic Textiles Inc', date: '27 Oct 2026', into: 'your USD account ending 6789', status: 'On hold', tone: 'warn', action: true,
        steps: [['Received by US partner bank', '08:02', 'done'], ['On hold: invoice needed', '08:05', 'hold'], ['Credited to USD wallet', 'Waiting', 'todo']] }
      : { amount: '$2,950.00', from: 'Atlantic Textiles Inc', date: '27 Oct 2026', into: 'your USD account ending 6789', status: 'In review', tone: 'grey',
        steps: [['Received by US partner bank', '08:02', 'done'], ['Invoice received', 'Just now', 'done'], ['Compliance review', 'Usually under 2 hours', 'now'], ['Credited to USD wallet', 'Waiting', 'todo']] };
    return { amount: '₦1,850,000', from: 'Lekki Fresh Market', date: '26 Oct 2026', into: 'your NGN account ending 6789', status: 'Credited', tone: 'ok',
      steps: [['Received via NIP transfer', '10:41', 'done'], ['Matched to Lekki Fresh Market', '10:41', 'done'], ['Credited to NGN wallet', '10:42', 'done'], ['Swept into Earn', 'Tonight, above your floor', 'now']] };
  }
  const toneColor = { ok: 'var(--ok)', warn: 'var(--warn)', grey: 'var(--violet-deep)' };
  const parents = { fund: 'home', track: 'home', detail: 'collect', customers: 'collect', team: 'more', cards: 'more', dev: 'more' };
  const back = () => parents[S.screen] ? `<button class="back" data-a="go" data-v="${parents[S.screen]}" aria-label="Back">${ic.back}</button>` : '';
  const toggle = (key, label, on) => `<button class="tog" data-a="${key}" aria-pressed="${on}" aria-label="${label}"></button>`;

  const fundInfo = {
    NGN: { sym: '₦', amt: '500,000', lines: [['Account number', '0123456789'], ['Bank', '[Partner MFB]'], ['Account name', 'KOLA EXPORTS LTD - MISAN']], via: 'any Nigerian bank app', fee: '2% of the amount', when: 'Usually within a minute' },
    USD: { sym: '$', amt: '1,000', lines: [['Routing number', '123456789'], ['Account number', '000123456789'], ['Account name', 'KOLA EXPORTS LTD']], via: 'ACH or wire from a US bank', fee: 'Free for ACH', when: '1 to 2 business days' },
    GBP: { sym: '£', amt: '1,000', lines: [['Sort code', '12-34-56'], ['Account number', '12345678'], ['Account name', 'KOLA EXPORTS LTD']], via: 'Faster Payments from a UK bank', fee: 'Free', when: 'Usually within minutes' }
  };


  const FEE = 0.02;
  const num = (s) => Number(String(s).replace(/[^0-9.]/g, '')) || 0;
  const symOf = (s) => String(s).replace(/[0-9.,\s]/g, '');
  const feeOf = (s) => { const v = num(s) * FEE; const sy = symOf(s); return sy + v.toLocaleString('en-GB', { maximumFractionDigits: sy === '₦' ? 0 : 2, minimumFractionDigits: sy === '₦' ? 0 : 2 }); };
  const recips = [
    { id: 'kwame', name: 'Kwame Mensah', where: 'Ghana · MTN Mobile Money · 024 *** 5512', cur: 'GHS', eta: 'Usually within minutes', place: 'Ghana' },
    { id: 'wanjiru', name: 'Wanjiru Kamau', where: 'Kenya · M-Pesa · 0712 *** 448', cur: 'KES', eta: 'Usually within minutes', place: 'Kenya' },
    { id: 'adeyemi', name: 'Adeyemi Packaging Ltd', where: 'Nigeria · Access Bank ending 4410', cur: 'NGN', eta: 'Usually within seconds', place: 'Nigeria' },
    { id: 'thames', name: 'Thames Freight Ltd', where: 'United Kingdom · Faster Payments ending 7781', cur: 'GBP', eta: 'Usually within minutes', place: 'the UK' }
  ];
  const countries = [['GHS', 'Ghana', 'Mobile money or bank'], ['KES', 'Kenya', 'M-Pesa or bank'], ['NGN', 'Nigeria', 'Bank account'], ['GBP', 'United Kingdom', 'Bank account'], ['USD', 'United States', 'Bank account'], ['CAD', 'Canada', 'Bank account or Interac']];
  // Sample rates: naira per unit of each currency.
  const rate = { NGN: 1, USD: 1385, GBP: 1972, EUR: 1610, CAD: 1005, GHS: 142.7, KES: 10.7 };
  const sym = { NGN: '₦', USD: '$', GBP: '£', EUR: '€', CAD: 'CA$', GHS: 'GHS ', KES: 'KES ' };
  const money = (cur, v) => { const whole = cur === 'NGN' || cur === 'KES'; return sym[cur] + v.toLocaleString('en-GB', { minimumFractionDigits: whole ? 0 : 2, maximumFractionDigits: whole ? 0 : 2 }); };
  function quote() {
    const r = S.recip === 'new' ? { name: S.newName || 'New recipient', where: countries.find((c) => c[0] === S.newCur)[1] + ' · ' + (S.newType || 'Bank account'), cur: S.newCur, eta: 'Usually within minutes', place: countries.find((c) => c[0] === S.newCur)[1] } : recips.find((x) => x.id === S.recip);
    const ngn = S.sendAmt * rate[S.sendFrom];
    return { r: r, get: ngn / rate[r.cur], ngn: ngn, rateLine: '1 ' + r.cur + ' = ' + money(S.sendFrom, rate[r.cur] / rate[S.sendFrom]) };
  }
  function sendForm(wrapOpen, wrapClose) {
    const q = quote();
    if (S.sendStage === 'review') return `${wrapOpen}<h2 style="margin:0">Check before you send</h2>

        <div class="term"><span style="color:#B9A8DA">Endpoints</span>${eps}</div>
        <div class="sect"><h2>Webhook events</h2></div><div class="list">${evs}</div>
        <button class="primary" data-a="testHook">Send test webhook</button>`;
    }
  };

  const tabDefs = [['home', 'Home', ic.home, ['home', 'track', 'fund']], ['collect', 'Collect', ic.in('currentColor'), ['collect', 'detail', 'customers']], ['pay', 'Pay', ic.out('currentColor'), ['pay']], ['earn', 'Earn', ic.up('currentColor'), ['earn']], ['more', 'More', ic.menu, ['more', 'team', 'cards', 'dev']]];

  const screenEl = document.getElementById('screen');
  const tabsEl = document.getElementById('tabs');
  const toastEl = document.getElementById('toast');
  let toastTimer;
  function flash(msg) { toastEl.textContent = msg; toastEl.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => { toastEl.hidden = true; }, 2800); }

  function render(scrollTop) {
    screenEl.innerHTML = views[S.screen]();
    tabsEl.innerHTML = tabDefs.map((t) => `<button data-a="go" data-v="${t[0]}"${t[3].includes(S.screen) ? ' aria-current="page"' : ''}>${t[2]}${t[1]}</button>`).join('');
    if (scrollTop) screenEl.scrollTop = 0;
  }
  function go(screen) { S.screen = screen; render(true); }

  const actions = {
    go: (v) => go(v),

    payMode: (v) => { S.payMode = v; render(); },
    recip: (v) => { S.recip = v; render(); },
    sendReview: () => { if (!(S.sendAmt > 0)) { flash('Enter an amount to send.'); return; } if (S.recip === 'new' && !S.newName) { flash('Add the name on the account first.'); return; } S.sendStage = 'review'; render(true); },
    sendEdit: () => { S.sendStage = 'form'; render(); },
    sendConfirm: () => { const q = quote(); S.sendStage = q.ngn > 5000000 ? 'approval' : 'sent'; render(true); flash(q.ngn > 5000000 ? 'Sent to Tunde for approval.' : 'Sent. You can track it here and on Home.'); },
    sendApprove: () => { S.sendStage = 'sent'; render(true); flash('Approved and sent.'); },
    sendReceipt: () => flash('Receipt copied: share it with your recipient (demo).'),
    sendAgain: () => { S.sendStage = 'form'; S.recip = 'kwame'; render(true); },
    fundCur: (v) => { S.fundCur = v; render(); },
    fundMethod: (v) => { S.fundMethod = v; render(); },
    fundDone: (v) => {
      const a = (document.getElementById('famt') || {}).value;
      flash(v === 'transfer' ? 'Thanks. We\'ll tell you the moment it lands in your ' + S.fundCur + ' wallet.' : v === 'card' ? a + ' added to your ' + S.fundCur + ' wallet (demo).' : a + ' added to your ' + S.fundCur + ' wallet from your ' + document.getElementById('ffrom').value + ' (demo).');
    },
    wallet: () => { S.wallet = (S.wallet + 1) % wallets.length; render(); },
    track: (v) => { S.pay = v; go('track'); },
    detail: (v) => { S.cur = v; go('detail'); },
    copy: (v) => flash(v + ' copied'),
    convert: () => { S.convert[S.cur] = !S.convert[S.cur]; render(); },
    share: () => flash(S.cur + ' account details copied. Paste them into an invoice or email.'),
    activate: () => { S.opened[S.cur] = true; render(); flash('Your ' + S.cur + ' account is ready, in the name Kola Exports Ltd.'); },
    upload: () => { S.held = false; render(); flash('Invoice uploaded. We will update you here as soon as it is reviewed.'); },
    submit: () => { S.run = 'pending'; render(); flash('Submitted. Tunde will get a notification to approve.'); },
    approve: () => { S.run = 'sent'; render(); flash('Approved. 12 payouts are on their way; track each one on Home.'); },
    resetRun: () => { S.run = 'draft'; render(); },
    earnCur: (v) => { S.earnCur = v; render(); },
    sweep: () => { S.sweep = !S.sweep; render(); flash(S.sweep ? 'Evening sweep is on.' : 'Evening sweep is off. Your balance stays in the wallet.'); },
    wd: (v) => { S.wd = v; render(); },
    withdraw: (v) => flash(S.wd === 'notice' ? v + ' will be back in your wallet on Wed 28 Oct, free.' : v + ' is back in your wallet now, less the 2% instant fee (' + feeOf(v) + ').'),
    more: (v) => {
      if (v === 'xero') { S.xero = !S.xero; render(); flash(S.xero ? 'Xero connected. Transactions sync every hour.' : 'Xero disconnected.'); }
      else if (v === 'statement') flash('October statement ready (demo).');
      else go(v);
    },
    rule: () => { S.rule = !S.rule; render(); },
    match: () => { S.match = !S.match; render(); },
    addCustomer: () => flash('New customer account created. Share its details with your customer.'),
    testHook: () => flash('Test event payout.completed sent to your webhook URL.')
  };

  document.querySelector('.phone').addEventListener('click', (ev) => {
    const b = ev.target.closest('[data-a]');
    if (!b || !actions[b.dataset.a]) return;
    actions[b.dataset.a](b.dataset.v);
  });

  document.addEventListener('input', (e) => {
    const id = e.target.id;
    if (id === 'samt') { S.sendAmt = Number(String(e.target.value).replace(/[^0-9.]/g, '')) || 0; const q = quote(); const g = document.getElementById('sget'); if (g) g.textContent = money(q.r.cur, q.get); const fe = document.getElementById('sfee'); if (fe) fe.textContent = money(S.sendFrom, S.sendAmt * FEE); const to = document.getElementById('stot'); if (to) to.textContent = money(S.sendFrom, S.sendAmt * (1 + FEE)); }
    if (id === 'famt') { const ff = document.getElementById('ffee'); if (ff) ff.textContent = '2% · ' + feeOf(e.target.value); }
    if (id === 'nname') S.newName = e.target.value;
  });
  document.addEventListener('change', (e) => {
    const id = e.target.id;
    if (id === 'sfrom') { S.sendFrom = e.target.value; render(); }
    if (id === 'ncountry') { S.newCur = e.target.value; S.newType = ''; render(); }
    if (id === 'ntype') S.newType = e.target.value;
  });
  render(true);
})();
</script>

</body>
</html>
